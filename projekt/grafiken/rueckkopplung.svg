<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="pf" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>

  <g stroke="#263b43" stroke-width="2.5">
    <rect x="60" y="40" width="270" height="95" rx="12" fill="#dae8fc"/>
    <rect x="430" y="40" width="270" height="95" rx="12" fill="#fff2cc"/>
    <rect x="430" y="240" width="270" height="95" rx="12" fill="#f8cecc"/>
    <rect x="60" y="240" width="270" height="95" rx="12" fill="#e1d5e7"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="195" y="68" font-weight="bold" font-size="16">1 · Das Modell entscheidet</text>
    <text x="195" y="92" font-size="13">Beispiel: Kredit abgelehnt,</text>
    <text x="195" y="110" font-size="13">weil der Wohnort als riskant gilt</text>

    <text x="565" y="68" font-weight="bold" font-size="16">2 · Die Realität verändert sich</text>
    <text x="565" y="92" font-size="13">Im Quartier gibt es weniger Kredite,</text>
    <text x="565" y="110" font-size="13">Geschäfte und Häuser gehen ein</text>

    <text x="565" y="268" font-weight="bold" font-size="16">3 · Neue Daten entstehen</text>
    <text x="565" y="292" font-size="13">Es gibt mehr Zahlungsprobleme</text>
    <text x="565" y="310" font-size="13">in diesem Quartier</text>

    <text x="195" y="268" font-weight="bold" font-size="16">4 · Das Modell bestätigt sich</text>
    <text x="195" y="292" font-size="13">«Der Wohnort war tatsächlich</text>
    <text x="195" y="310" font-size="13">ein Risiko»: noch mehr Ablehnungen</text>
  </g>
  <g fill="none" stroke="#263b43" stroke-width="3" marker-end="url(#pf)">
    <line x1="335" y1="88" x2="422" y2="88"/>
    <line x1="565" y1="140" x2="565" y2="232"/>
    <line x1="425" y1="288" x2="338" y2="288"/>
    <line x1="195" y1="235" x2="195" y2="143"/>
  </g>
  <g text-anchor="middle" fill="#8a1c1c" font-weight="bold">
    <text x="380" y="160" font-size="17">Rückkopplung</text>
    <text x="380" y="182" font-size="13" font-weight="normal">Das Modell erzeugt die Daten,</text>
    <text x="380" y="199" font-size="13" font-weight="normal">die es später bestätigen.</text>
    <text x="380" y="220" font-size="13" font-weight="normal">Ungleichheit wird verstärkt.</text>
  </g>
</svg>
