name: Regenerate first-year teaching documents (temporary)
on:
  push:
    branches:
      - feature/1klasse-8dl-gefuertes-bildprojekt
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feature/1klasse-8dl-gefuertes-bildprojekt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1klasse-8dl-gefuertes-bildprojekt
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document-generation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Rebuild all 40 student documents per first-year course
        run: |
          python scripts/build_student_documents.py --course bok/1-klasse
          python scripts/build_student_documents.py --course _vorlagen/1-klasse
          python tests/check_student_documents.py
      - name: Commit generated DOCX, indices and ZIPs to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kurse/bok/1-klasse/lehrperson/dokumente kurse/_vorlagen/1-klasse/lehrperson/dokumente
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate first-year Word worksheets for eight double lessons"
            git push origin HEAD:feature/1klasse-8dl-gefuertes-bildprojekt
          fi
