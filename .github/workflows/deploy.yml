name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build notebook autostart
        run: |
          npm ci --prefix extensions/ki-autostart
          npm run build --prefix extensions/ki-autostart
          node tests/check_autostart.cjs
          node tests/check_archive.cjs
          node tests/check_notebook_snapshot.cjs
      - name: Check simplified teaching project
        run: |
          python tests/check_ki_basis.py
          python tests/check_pyodide_lock.py
      - name: Build the JupyterLite site
        run: |
          python scripts/build_portal.py
          python scripts/build_course.py
          python scripts/build_portal_notebooks.py
          python tests/check_course.py
          python tests/check_portal_content.py
          jupyter lite build --contents content --output-dir dist
          python scripts/copy_portal.py dist
      - name: Check deployed notebook runtime in Chromium
        timeout-minutes: 20
        run: |
          npm install --prefix /tmp/ki-browser playwright
          /tmp/ki-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/ki-browser/node_modules PORTAL_SITE=dist CHECK_NOTEBOOK=1 CHECK_TRAINING=1 node tests/check_portal.cjs
          NODE_PATH=/tmp/ki-browser/node_modules PORTAL_SITE=dist node tests/check_persistence.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
