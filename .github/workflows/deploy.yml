name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build notebook autostart
        run: |
          npm ci --prefix extensions/ki-autostart
          npm run build --prefix extensions/ki-autostart
          node tests/check_autostart.cjs
          node tests/check_archive.cjs
      - name: Check simplified teaching project
        run: python tests/check_ki_basis.py
      - name: Build the JupyterLite site
        run: |
          python scripts/build_portal_notebooks.py
          jupyter lite build --contents content --output-dir dist
          python scripts/copy_portal.py dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
