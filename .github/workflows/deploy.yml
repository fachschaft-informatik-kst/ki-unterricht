name: Build and Deploy

# Stop outdated CI runs when new commits arrive on the same branch or PR.
concurrency:
  group: ki-unterricht-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      site_changed: ${{ steps.scope.outputs.site_changed }}
      worker_changed: ${{ steps.scope.outputs.worker_changed }}
      runtime_changed: ${{ steps.scope.outputs.runtime_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect affected deployment targets
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # PR checkout is a merge commit: HEAD^1 is the base branch.
          # Push events compare with "before" to include every pushed commit.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="${{ github.event.before }}"
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1 || true
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null ||
             ! git diff --name-only -z "$base" HEAD > /tmp/ki-changed-paths; then
            echo "Cannot determine changed files: conservatively build and deploy both targets."
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            echo "worker_changed=true" >> "$GITHUB_OUTPUT"
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          site=false
          worker=false
          runtime=false
          while IFS= read -r -d '' file; do
            echo "Changed: $file"
            case "$file" in
              admin-worker/*)
                worker=true
                ;;
              shared/course-model.js|shared/glossary-model.js)
                site=true
                worker=true
                runtime=true
                ;;
              projekt/admin/*|tests/check_admin.mjs|tests/check_admin_form.cjs)
                # Editor UI changes still build Pages and run editor browser tests,
                # but do not need the Pyodide/notebook integration suite.
                site=true
                ;;
              README.md|docs/*)
                # Documentation is not included in either deployed runtime.
                ;;
              *)
                # All other changes get full site CI, including CI changes.
                site=true
                runtime=true
                ;;
            esac
          done < /tmp/ki-changed-paths
          echo "site_changed=$site" >> "$GITHUB_OUTPUT"
          echo "worker_changed=$worker" >> "$GITHUB_OUTPUT"
          echo "runtime_changed=$runtime" >> "$GITHUB_OUTPUT"
          echo "Impact: site=$site worker=$worker runtime=$runtime"
      - name: Verify Worker-only changes
        if: steps.scope.outputs.worker_changed == 'true' && steps.scope.outputs.site_changed != 'true'
        run: |
          node --check admin-worker/src/index.mjs
          node tests/check_admin.mjs
      - name: Setup Python
        if: steps.scope.outputs.site_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-preview.txt
      - name: Install the dependencies
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.site_changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/ki-autostart/package-lock.json
      - name: Verify local Makefile targets
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          make help
          make -n preview > /tmp/ki-preview-make.txt
          grep -Fq 'scripts/preview.py' /tmp/ki-preview-make.txt
          make -n local > /tmp/ki-local-make.txt
          grep -Fq 'jupyter lite build' /tmp/ki-local-make.txt
          grep -Fq 'scripts/copy_portal.py' /tmp/ki-local-make.txt
          grep -Fq 'http.server' /tmp/ki-local-make.txt
      - name: Smoke-test local Makefile preview
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          timeout 75s make preview PORT=8765 > /tmp/ki-preview-server.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 -o /tmp/ki-preview.html http://127.0.0.1:8765/projekt/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ki-preview-server.log
            exit 1
          fi
          grep -Fq 'data-answer=' /tmp/ki-preview.html
          echo 'PASS Makefile preview: isolated Python setup, course build and HTTP server'
      - name: Build notebook autostart
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          npm ci --prefix extensions/ki-autostart
          npm run build --prefix extensions/ki-autostart
          node tests/check_autostart.cjs
          node tests/check_archive.cjs
          node tests/check_notebook_snapshot.cjs
          node tests/check_widget_rehydrate.cjs
          node --check projekt/admin/admin.js
          node --check projekt/admin/plan-editor.js
          node --check admin-worker/src/index.mjs
          node tests/check_admin.mjs
          node tests/check_markdown_parity.cjs
          node --check projekt/glossar.js
          node --check projekt/dl1_sort.js
          node --check content/ki_projekt/fotostudio_storage.js
          node tests/check_fotostudio_inline.cjs
          node tests/check_course_model.mjs
          node tests/check_glossary_model.mjs
      - name: Install Playwright test runner
        if: steps.scope.outputs.site_changed == 'true'
        id: playwright
        run: |
          npm install --prefix /tmp/ki-browser playwright
          node -p "require('/tmp/ki-browser/node_modules/playwright/package.json').version" | sed 's/^/version=/' >> "$GITHUB_OUTPUT"
      - name: Restore cached Chromium
        if: steps.scope.outputs.site_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Prepare Chromium and required system libraries
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          /tmp/ki-browser/node_modules/.bin/playwright install chromium
          # Avoid apt when the runner already has all host libraries.
          # If Chromium cannot start, install system deps and retry.
          if ! node -e "require('/tmp/ki-browser/node_modules/playwright').chromium.launch().then(b=>b.close())"; then
            /tmp/ki-browser/node_modules/.bin/playwright install-deps chromium
            node -e "require('/tmp/ki-browser/node_modules/playwright').chromium.launch().then(b=>b.close())"
          fi
      - name: Browser-check teacher editor
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          NODE_PATH=/tmp/ki-browser/node_modules node tests/check_admin_form.cjs
      - name: Check simplified teaching project
        if: steps.scope.outputs.runtime_changed == 'true'
        run: |
          python tests/check_ki_basis.py
          python tests/execute_all_notebooks.py
          python tests/check_pyodide_lock.py
          python tests/check_kernel_compat.py
      - name: Generate course pages and notebook sources
        if: steps.scope.outputs.site_changed == 'true'
        timeout-minutes: 4
        run: |
          python scripts/build_portal.py
          python scripts/build_course.py
          python scripts/build_basis.py
          python scripts/build_portal_notebooks.py
      - name: Validate generated content and editor parity
        if: steps.scope.outputs.site_changed == 'true'
        timeout-minutes: 5
        run: |
          python tests/check_basis.py
          python tests/check_course.py
          python tests/check_generated_content.py
          python tests/check_new_chapter.py
          python tests/check_admin.py
          python tests/check_new_lessons.py
          python tests/check_new_lesson_cli.py
          python tests/check_course_model.py
          python tests/check_didactics.py
          python tests/check_glossary_p0.py
          python tests/check_dl1_assignments.py
          python tests/check_semantic_alignment.py
          python tests/check_materials.py
          python scripts/format_course_sources.py --check
          python scripts/sync_editor_preview.py --check
          python tests/check_portal_content.py
          python tests/check_solutions.py
          python tests/check_content_mvc.py
      # JupyterLite's kernel, compiled labextension and notebook snapshot are
      # independent of Markdown/CSS/editor pages. Cache the RAW runtime only.
      # Save BEFORE copy_portal.py so old course pages never enter the cache.
      - name: Restore JupyterLite runtime cache
        if: steps.scope.outputs.site_changed == 'true'
        id: lite-cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: lite-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt', 'requirements-preview.txt', 'jupyter_lite_config.json', 'content/**', 'experimente/registry.json', 'extensions/ki-autostart/**', 'scripts/build_portal_notebooks.py') }}
      - name: Build JupyterLite runtime on cache miss
        if: steps.scope.outputs.site_changed == 'true' && steps.lite-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          echo "No matching JupyterLite runtime cache: building from current notebooks"
          jupyter lite build --contents _build/content --output-dir dist
      - name: Cache raw JupyterLite runtime before course overlay
        if: steps.scope.outputs.site_changed == 'true' && steps.lite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: ${{ steps.lite-cache.outputs.cache-primary-key }}
      - name: Package current course pages with JupyterLite
        if: steps.scope.outputs.site_changed == 'true'
        timeout-minutes: 4
        run: |
          test -f dist/jupyter-lite.json
          python scripts/copy_portal.py dist
          test -f dist/projekt/admin/index.html
          test -f dist/projekt/admin/admin.js
          test -f dist/projekt/admin/plan-editor.js
          test -f dist/projekt/admin/glossary-model.js
      # Course widgets and their fullscreen controls can change with CSS/JS
      # alone. Always exercise the lightweight course browser test on site
      # changes, even when the expensive Python runtime is unchanged.
      - name: Browser-check course UI and notebook fullscreen
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          NODE_PATH=/tmp/ki-browser/node_modules PORTAL_SITE=dist node tests/check_basis_browser.cjs
      - name: Browser-check Fotostudio storage
        if: steps.scope.outputs.runtime_changed == 'true'
        run: |
          NODE_PATH=/tmp/ki-browser/node_modules PORTAL_SITE=dist node tests/check_fotostudio_storage.cjs
      # The embedded course test alone cannot detect widget-manager startup
      # races in the standalone JupyterLite app. Check a clean first launch.
      - name: Check first JupyterLite widget render without kernel restart
        if: steps.scope.outputs.runtime_changed == 'true'
        timeout-minutes: 4
        run: |
          NODE_PATH=/tmp/ki-browser/node_modules LITE_SITE=dist KI_WIDGET_COLD_START=1 node tests/check_autostart_browser.cjs
      - name: Check deployed notebook runtime in Chromium
        if: steps.scope.outputs.runtime_changed == 'true'
        timeout-minutes: 12
        run: |
          # Independent browser tests use different local ports. Run them in
          # parallel, preserve both exit codes and print both diagnostic logs.
          set +e
          NODE_PATH=/tmp/ki-browser/node_modules PORTAL_SITE=dist CHECK_NOTEBOOK=1 CHECK_TRAINING=1 node tests/check_portal.cjs > /tmp/ki-portal-browser.log 2>&1 &
          portal_pid=$!
          NODE_PATH=/tmp/ki-browser/node_modules PORTAL_SITE=dist PORTAL_TEST_PORT=8766 node tests/check_persistence.cjs > /tmp/ki-persistence-browser.log 2>&1 &
          persistence_pid=$!
          wait "$portal_pid"
          portal_status=$?
          wait "$persistence_pid"
          persistence_status=$?
          echo "=== Portal, Python training and notebook switching (exit $portal_status) ==="
          cat /tmp/ki-portal-browser.log
          echo "=== ZIP restore, five notebooks, widgets and uploads (exit $persistence_status) ==="
          cat /tmp/ki-persistence-browser.log
          if [ "$portal_status" -ne 0 ] || [ "$persistence_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scope.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.site_changed == 'true'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_worker:
    name: Deploy authenticated teacher editor Worker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.worker_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: kst-ki-admin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable automatic Worker deployments."
            exit 1
          fi
      - name: Deploy Cloudflare Worker
        working-directory: admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 deploy
