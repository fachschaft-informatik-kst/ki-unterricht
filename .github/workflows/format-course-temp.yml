name: Format course content once
on:
  push:
    branches:
      - refactor/readable-lesson-markdown
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format all source lessons
        run: |
          python scripts/format_course_sources.py
          python scripts/format_course_sources.py --check
      - name: Commit formatted sources to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kursseiten
          if ! git diff --cached --quiet; then
            git commit -m "style: readable Markdown lesson sources"
            git push origin HEAD:refactor/readable-lesson-markdown
          fi
