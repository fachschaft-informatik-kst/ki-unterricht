name: Format course content once
on:
  push:
    branches:
      - refactor/readable-lesson-markdown
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format all source lessons
        run: |
          python scripts/format_course_sources.py
          cp kursseiten/projekt/000-einstieg.md /tmp/projekt-original.md
          cp kursseiten/einstieg/010-einstieg-1.md /tmp/einstieg-original.md
          python scripts/format_course_sources.py
          diff -u /tmp/projekt-original.md kursseiten/projekt/000-einstieg.md | head -100 || true
          diff -u /tmp/einstieg-original.md kursseiten/einstieg/010-einstieg-1.md | head -100 || true
          python scripts/format_course_sources.py --check
      - name: Commit formatted sources to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kursseiten
          if ! git diff --cached --quiet; then
            git commit -m "style: readable Markdown lesson sources"
            git push origin HEAD:refactor/readable-lesson-markdown
          fi
