name: Build optional Xeus kernel prototype
on:
  workflow_dispatch:
jobs:
  xeus-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up micromamba for the Emscripten Xeus environment
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
      - name: Install isolated benchmark dependencies
        run: python -m pip install -r benchmarks/xeus/requirements.txt
      - name: Build standalone Xeus Python site
        working-directory: benchmarks/xeus
        run: |
          jupyter lite build --contents content --output-dir ../../_build/xeus-probe
          test -f ../../_build/xeus-probe/lab/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('../../_build/xeus-probe/jupyter-lite.json').read_text())
          assert config['jupyter-config-data'], 'Missing runtime config'
          print('PASS Xeus prototype assets generated (no production site overwritten)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xeus-prototype
          path: _build/xeus-probe/
          retention-days: 7
