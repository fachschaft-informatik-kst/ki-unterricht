<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="Helvetica,Arial,sans-serif" font-size="15" role="img" aria-labelledby="titel beschreibung"><title id="titel">XOR mit einem Schwimmbad-Neuron</title><desc id="beschreibung">Wie im Jupyter Notebook: Zwei Eingaben Sonne 1 und Freund:innen 1 über Gewichte jeweils plus 1 in ein Neuron mit Bias minus 0,5. Die Summe ist plus 1,5; Ausgabe 1. Die XOR-Regel verlangt jedoch 0. Die anderen drei Fälle werden korrekt entschieden, eine andere Gewichtswahl kann aber nie alle vier lösen.</desc><defs><marker id="pfeil" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="1" y="1" width="818" height="537" rx="16" fill="#f8fafb" stroke="#eff4f7" stroke-width="1.3"/><text x="26" y="47" font-size="25" font-weight="700" fill="#173c4e">Warum ein einzelnes Neuron XOR nicht löst</text><text x="26" y="79" font-size="17" font-weight="400" fill="#3b5a69">Schwimmbad: S = 1  ·  F = 1  ·  Ziel für XOR: Nein (0)</text><g transform="translate(44 115) scale(1.55)"><rect x="0" y="0" width="470" height="242" rx="8" fill="#ffffff" stroke="#c8d6de" stroke-width="1.3"/><text x="10" y="18" font-size="13" font-weight="700" fill="#263b43">Eingaben</text><text x="128" y="18" font-size="13" font-weight="700" fill="#263b43">Gewichte</text><text x="269" y="18" font-size="13" font-weight="700" fill="#263b43">Neuron</text><text x="397" y="18" font-size="13" font-weight="700" fill="#263b43">Ausgabe</text><circle cx="46" cy="70" r="24" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="46" y="77" font-size="20" font-weight="700" fill="#222" text-anchor="middle">1</text><text x="46" y="112" font-size="12" font-weight="400" fill="#52656a" text-anchor="middle">S: Sonne</text><circle cx="46" cy="160" r="24" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="46" y="167" font-size="20" font-weight="700" fill="#222" text-anchor="middle">1</text><text x="46" y="202" font-size="12" font-weight="400" fill="#52656a" text-anchor="middle">F: Freund:innen</text><line x1="75" y1="70" x2="249" y2="104" stroke="#176c63" stroke-width="2.75" marker-end="url(#pfeil)"/><line x1="75" y1="160" x2="249" y2="128" stroke="#176c63" stroke-width="2.75" marker-end="url(#pfeil)"/><rect x="139" y="45" width="36" height="24" rx="5" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/><text x="144" y="64" font-size="17" font-weight="700" fill="#176c63">+1</text><rect x="139" y="147" width="36" height="24" rx="5" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/><text x="144" y="166" font-size="17" font-weight="700" fill="#176c63">+1</text><circle cx="294" cy="116" r="44" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="294" y="112" font-size="20" font-weight="700" fill="#263b43" text-anchor="middle">Σ + b</text><text x="294" y="136" font-size="14" font-weight="400" fill="#263b43" text-anchor="middle">= +1,5</text><text x="294" y="186" font-size="13" font-weight="400" fill="#52656a" text-anchor="middle">Bias −0,5</text><line x1="340" y1="116" x2="374" y2="116" stroke="#263b43" stroke-width="2" marker-end="url(#pfeil)"/><rect x="385" y="84" width="73" height="65" rx="11" fill="#d7ebe3" stroke="#263b43" stroke-width="1.3"/><text x="421" y="111" font-size="18" font-weight="700" fill="#176c63" text-anchor="middle">Ja</text><text x="421" y="133" font-size="15" font-weight="400" fill="#52656a" text-anchor="middle">y = 1</text><text x="10" y="228" font-size="12.3" font-weight="400" fill="#263b43">1·(+1) + 1·(+1) + (−0,5) = +1,5</text><text x="458" y="228" font-size="13" font-weight="700" fill="#be572b" text-anchor="end">Ziel 0 (falsch)</text></g><text x="410" y="521" font-size="16" font-weight="700" fill="#ad5136" text-anchor="middle">Diese Gewichte liefern 3 von 4 richtig – für S = F = 1 aber die falsche Antwort.</text></svg>