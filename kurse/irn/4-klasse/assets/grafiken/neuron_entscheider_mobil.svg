<svg xmlns="http://www.w3.org/2000/svg" width="450" height="437" viewBox="0 0 450 437" font-family="Arial,Helvetica,sans-serif" role="img" aria-labelledby="title desc"><title id="title">Schwimmbad-Neuron mobil</title><desc id="desc">Drei Eingaben: Sonne 1, Freundinnen und Freunde 0, Prüfung morgen 1. Gewichte plus 2, plus 2 und minus 4, Bias minus 1, Summe minus 3 und Ausgabe Nein.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="450" height="437" rx="14" fill="#f5f8fa" stroke="#f5f8fa"/><text x="18" y="35" font-size="22" fill="#173e50" font-weight="700" text-anchor="start">Schwimmbad: ein Neuron entscheidet</text><text x="18" y="63" font-size="15" fill="#52656a" font-weight="400" text-anchor="start">Gleiche Eingaben und Gewichte wie in DL 3</text><text x="18" y="98" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Eingaben</text><text x="153" y="98" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Gewichte</text><text x="273" y="98" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Neuron</text><line x1="83" y1="156" x2="247" y2="219" stroke="#176c63" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="83" y1="243" x2="245" y2="243" stroke="#176c63" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="83" y1="330" x2="247" y2="267" stroke="#be572b" stroke-width="4.5" marker-end="url(#arrow)"/><circle cx="56" cy="156" r="25" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="56" y="164" font-size="22" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="56" y="203" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="56" cy="243" r="25" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="56" y="251" font-size="22" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="56" y="290" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="56" cy="330" r="25" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="56" y="338" font-size="22" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="56" y="377" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><rect x="147" y="128" width="60" height="26" rx="6" fill="#fff" stroke="#d1dee4"/><text x="177" y="147" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+2</text><rect x="147" y="205" width="60" height="26" rx="6" fill="#fff" stroke="#d1dee4"/><text x="177" y="224" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+2</text><rect x="147" y="316" width="60" height="26" rx="6" fill="#fff" stroke="#d1dee4"/><text x="177" y="335" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−4</text><circle cx="290" cy="243" r="47" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="290" y="238" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="290" y="264" font-size="16" fill="#263b43" font-weight="400" text-anchor="middle">= −3</text><text x="290" y="324" font-size="15" fill="#52656a" font-weight="400" text-anchor="middle">Bias = −1</text><line x1="339" y1="243" x2="369" y2="243" stroke="#263b43" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="376" y="214" width="69" height="59" rx="9" fill="#e3e6e8" stroke="#263b43"/><text x="410" y="240" font-size="17" fill="#52656a" font-weight="700" text-anchor="middle">Nein</text><text x="410" y="261" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">y = 0</text><text x="16" y="414" font-size="15" fill="#263b43" font-weight="400" text-anchor="start">1×2 + 0×2 + 1×(−4) − 1 = −3</text></svg>