<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 497" width="450" height="497" font-family="Arial,Helvetica,sans-serif" role="img" aria-labelledby="title desc"><title id="title">Schwimmbad-XOR: Fehlentscheidung eines Neurons</title><desc id="desc">Mobile Ansicht des einzelnen Neurons, genauso aufgebaut wie im Jupyter Notebook. Sonne 1 und Freundinnen und Freunde 1, Prüfung 0. Beide aktiven Gewichte plus 1, Prüfungsgewicht minus 4, Bias minus 0 Komma 5. Das Neuron sagt Ja, das XOR-Ziel lautet Nein.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="450" height="497" rx="15" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="0"/><text x="15" y="34" font-size="22" fill="#173e50" font-weight="700" text-anchor="start">XOR: ein einzelnes Neuron</text><text x="15" y="59" font-size="15" fill="#263b43" font-weight="400" text-anchor="start">Sonne 1 · Freund:innen 1 · Prüfung 0</text><g transform="translate(0 72)"><rect x="0" y="0" width="450" height="396" rx="13" fill="#fff" stroke="#d1dfe5" stroke-width="1.4"/><text x="18" y="29" font-size="20" fill="#176c63" font-weight="700" text-anchor="start">XOR: ein einzelnes Neuron</text><text x="18" y="58" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Eingaben</text><text x="152" y="58" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Gewichte</text><text x="266" y="58" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Neuron</text><circle cx="53" cy="135" r="25" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="53" y="143" font-size="22" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="53" y="179" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="53" cy="222" r="25" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="53" y="230" font-size="22" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="53" y="266" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="53" cy="309" r="25" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="53" y="317" font-size="22" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="53" y="353" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><line x1="81" y1="135" x2="246" y2="197" stroke="#176c63" stroke-width="3" marker-end="url(#arrow)"/><line x1="81" y1="222" x2="240" y2="222" stroke="#176c63" stroke-width="3.4" marker-end="url(#arrow)"/><line x1="81" y1="309" x2="246" y2="247" stroke="#be572b" stroke-width="4" marker-end="url(#arrow)"/><rect x="148" y="111" width="60" height="26" rx="6" fill="#fff" stroke="#d9e5e9" stroke-width="1"/><text x="178" y="130" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="148" y="182" width="60" height="26" rx="6" fill="#fff" stroke="#d9e5e9" stroke-width="1"/><text x="178" y="201" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="148" y="290" width="60" height="26" rx="6" fill="#fff" stroke="#d9e5e9" stroke-width="1"/><text x="178" y="309" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−4</text><circle cx="290" cy="222" r="47" fill="#cfe8dc" stroke="#263b43" stroke-width="2.4"/><text x="290" y="218" font-size="20" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="290" y="244" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">+1,5</text><text x="290" y="300" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">Bias −0,5</text><line x1="339" y1="222" x2="367" y2="222" stroke="#263b43" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="375" y="194" width="69" height="57" rx="9" fill="#d7ebe3" stroke="#263b43" stroke-width="1.6"/><text x="409" y="218" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="409" y="239" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><text x="18" y="379" font-size="15" fill="#be572b" font-weight="700" text-anchor="start">XOR-Ziel: Nein (0) · diese Ausgabe ist falsch</text></g><text x="16" y="486" font-size="15" fill="#be572b" font-weight="700" text-anchor="start">3 von 4 Fällen richtig – nicht alle vier.</text></svg>