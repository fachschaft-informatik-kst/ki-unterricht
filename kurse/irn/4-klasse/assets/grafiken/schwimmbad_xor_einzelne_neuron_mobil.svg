<svg xmlns="http://www.w3.org/2000/svg" width="450" height="557" viewBox="0 0 450 557" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">Schwimmbad-XOR einzeln, mobil</title><desc id="description">Sonne 1, Freundinnen und Freunde 1 und Prüfung morgen 0. Die Gewichte +1, +1, -2 und der Bias -0.5 stehen getrennt von den Verbindungslinien.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><text x="14" y="33" font-size="22" fill="#263b43" font-weight="700" text-anchor="start">XOR: ein einzelnes Neuron</text><g transform="translate(0 43)"><rect x="0" y="0" width="450" height="472" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="20" fill="#263b43" font-weight="700" text-anchor="start">P = 0 · Versuch mit XOR</text><line x1="85" y1="120" x2="245" y2="198" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="85" y1="227" x2="245" y2="226" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="85" y1="334" x2="245" y2="254" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="51" cy="120" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="127" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="51" y="167" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="51" cy="227" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="234" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="51" y="274" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="51" cy="334" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="341" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="51" y="381" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="298" cy="226" r="47" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="298" y="221" font-size="20" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="298" y="248" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= +1,5</text><line x1="349" y1="226" x2="368" y2="226" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="378" y="195" width="66" height="66" rx="11" fill="#d7ebe3" stroke="#263b43" stroke-width="1.5"/><text x="411" y="223" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="411" y="247" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><text x="18" y="371" font-size="15" fill="#be572b" font-weight="700" text-anchor="start">XOR-Ziel: Nein (0)  · Fehler</text><rect x="8" y="398" width="101" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="19" y="415" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Sonne</text><text x="19" y="434" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +1</text><rect x="115" y="398" width="101" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="126" y="415" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Freund:innen</text><text x="126" y="434" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +1</text><rect x="222" y="398" width="101" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="233" y="415" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Prüfung</text><text x="233" y="434" font-size="16" fill="#be572b" font-weight="700" text-anchor="start">w = −2</text><rect x="329" y="398" width="97" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="340" y="415" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Bias</text><text x="340" y="434" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">b = −0,5</text></g><text x="14" y="531" font-size="14" fill="#52656a" font-weight="400" text-anchor="start">Bei P = 1 bremst das Gewicht −2 den Ausgang.</text></svg>