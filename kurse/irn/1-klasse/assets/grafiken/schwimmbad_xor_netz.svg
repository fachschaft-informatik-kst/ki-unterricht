<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="570" viewBox="0 0 1020 570" font-family="Helvetica,Arial,sans-serif" font-size="15" role="img" aria-labelledby="titel beschreibung"><title id="titel">Schwimmbad-XOR mit Hidden Layer</title><desc id="beschreibung">Sonne 1 und Freundinnen und Freunde 0 gehen in die Neuronen OR und NAND. Beide geben 1 aus. Das AND-Ausgabeneuron gibt Ja 1 aus. Prüfung morgen 0 ist als feste, hier nicht verwendete Eingabe sichtbar. Gewichte und Bias sind beschriftet.</desc><defs><marker id="pfeil" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="1020" height="570" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="23" y="34" font-size="23" fill="#173e50" font-weight="700" text-anchor="start">XOR: aus einem Neuron wird ein Netz</text><text x="23" y="61" font-size="17" fill="#4b6471" font-weight="400" text-anchor="start">Beispiel: Sonne 1 · Freund:innen 0 · Prüfung 0 (fest)</text><text x="55" y="99" font-size="17" fill="#263b43" font-weight="700" text-anchor="start">Eingaben</text><text x="330" y="99" font-size="17" fill="#263b43" font-weight="700" text-anchor="start">Gewichte</text><text x="430" y="99" font-size="17" fill="#263b43" font-weight="700" text-anchor="start">Hidden Layer</text><text x="725" y="99" font-size="17" fill="#263b43" font-weight="700" text-anchor="start">Neuron</text><text x="904" y="99" font-size="17" fill="#263b43" font-weight="700" text-anchor="start">Ausgabe</text><line x1="126" y1="170" x2="407" y2="168" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="126" y1="303" x2="410" y2="197" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="126" y1="170" x2="410" y2="327" stroke="#be572b" stroke-width="3" marker-end="url(#pfeil)"/><line x1="126" y1="303" x2="407" y2="355" stroke="#be572b" stroke-width="3" marker-end="url(#pfeil)"/><line x1="516" y1="174" x2="727" y2="251" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="516" y1="348" x2="727" y2="289" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="837" y1="270" x2="896" y2="270" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><circle cx="87" cy="170" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="87" y="177" font-size="20" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="87" y="216" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="87" cy="303" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="87" y="310" font-size="20" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="87" y="349" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="87" cy="452" r="29" fill="#f1f3f5" stroke="#8d9aa0" stroke-width="1.7"/><text x="87" y="459" font-size="20" fill="#667984" font-weight="700" text-anchor="middle">0</text><text x="136" y="448" font-size="16" fill="#52656a" font-weight="400" text-anchor="start">P: Prüfung morgen = 0</text><text x="136" y="470" font-size="14" fill="#667984" font-weight="400" text-anchor="start">fest, hier nicht verbunden</text><rect x="302" y="130" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="326" y="148" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="334" y="214" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="358" y="232" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="334" y="296" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="358" y="314" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−1</text><rect x="300" y="369" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="324" y="387" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−1</text><rect x="613" y="180" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="637" y="198" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="613" y="348" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="637" y="366" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><circle cx="464" cy="170" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="464" y="163" font-size="21" fill="#176c63" font-weight="700" text-anchor="middle">OR</text><text x="464" y="187" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">Σ+b → 1</text><text x="464" y="238" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">b = −0,5</text><circle cx="464" cy="348" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="464" y="341" font-size="19" fill="#176c63" font-weight="700" text-anchor="middle">NAND</text><text x="464" y="365" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">Σ+b → 1</text><text x="464" y="418" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">b = +1,5</text><circle cx="782" cy="270" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="782" y="263" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle">AND</text><text x="782" y="289" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">Σ+b → 1</text><text x="782" y="343" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">b = −1,5</text><rect x="903" y="232" width="99" height="76" rx="12" fill="#d7ebe3" stroke="#263b43" stroke-width="2"/><text x="952" y="262" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="952" y="288" font-size="15" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><rect x="24" y="504" width="972" height="49" rx="9" fill="#eff5f2" stroke="#c5d9ce" stroke-width="1.5"/><text x="42" y="535" font-size="18" fill="#176c63" font-weight="700" text-anchor="start">OR = 1 und NAND = 1  →  AND = 1  →  Schwimmen: Ja</text></svg>