<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-labelledby="t d">
  <title id="t">EVA-Modell mit Erfahrungsschatz</title>
  <desc id="d">Eine Eingabe wird verarbeitet; die Verarbeitung nutzt den Erfahrungsschatz und kann ihn verändern. Daraus entsteht die Ausgabe.</desc>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="pfeilhell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fff"/>
    </marker>
  </defs>
  <rect width="680" height="220" rx="10" fill="#d6dce5"/>
  <rect x="205" y="20" width="270" height="180" rx="26" fill="#333f50" stroke="#1f2733" stroke-width="4"/>
  <rect x="20" y="90" width="130" height="40" rx="7" fill="#fff" stroke="#179c7d" stroke-width="2.5"/>
  <text x="85.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" font-weight="bold" fill="#179c7d">Eingabe</text>
  <line x1="150" y1="110" x2="203" y2="110" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <line x1="477" y1="110" x2="528" y2="110" stroke="#111" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <rect x="530" y="90" width="130" height="40" rx="7" fill="#fff" stroke="#bf8f00" stroke-width="2.5"/>
  <text x="595.0" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" font-weight="bold" fill="#bf8f00">Ausgabe</text>
  <rect x="250" y="40" width="180" height="40" rx="7" fill="#adb9ca" stroke="#1f2733" stroke-width="2"/>
  <text x="340.0" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">Verarbeitung</text>
  <line x1="340" y1="84" x2="340" y2="136" stroke="#fff" stroke-width="2.5" marker-end="url(#pfeilhell)" marker-start="url(#pfeilhell)"/>
  <rect x="225" y="140" width="230" height="40" rx="7" fill="#adb9ca" stroke="#1f2733" stroke-width="2"/>
  <text x="340.0" y="160.0" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" fill="#111">Erfahrungsschatz</text>
</svg>
