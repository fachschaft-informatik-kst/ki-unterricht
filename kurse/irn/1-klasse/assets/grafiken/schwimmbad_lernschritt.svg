<svg xmlns="http://www.w3.org/2000/svg" width="800" height="965" viewBox="0 0 800 965" font-family="Helvetica,Arial,sans-serif" font-size="15" role="img" aria-labelledby="titel beschreibung"><title id="titel">Ein Lernschritt am Schwimmbad-Neuron</title><desc id="beschreibung">Drei Eingaben fliessen über gewichtete Verbindungen in ein Neuron. Vorher: Sonne 1 Gewicht 0, Freund:innen 0 Gewicht plus 2, Prüfung 0 Gewicht minus 4, Bias minus 1,5, Ausgabe Nein 0. Nach Korrektur mit Lernrate 1 wird das Sonnengewicht zu plus 1 und der Bias zu minus 0,5, Ausgabe Ja 1. Die übrigen Werte bleiben gleich.</desc><defs><marker id="pfeil" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="1" y="1" width="798" height="963" rx="17" fill="#f8fafb" stroke="#eff4f7" stroke-width="1.3"/><text x="26" y="44" font-size="26" font-weight="700" fill="#163a4b">Was lernt ein Schwimmbad-Neuron?</text><text x="26" y="81" font-size="18" font-weight="700" fill="#244758">Eingabe bleibt gleich: S = 1  ·  F = 0  ·  P = 0  ·  Ziel: Ja (1)</text><text x="25" y="119" font-size="20" font-weight="700" fill="#963d36">1   VORHER:  falsche Vorhersage</text><g transform="translate(20 134)"><rect x="0" y="0" width="760" height="330" rx="10" fill="#fff" stroke="#d3dee3" stroke-width="1.3"/><text x="30" y="26" font-size="16" font-weight="700" fill="#222">Eingaben</text><text x="215" y="26" font-size="16" font-weight="700" fill="#222">Gewichte</text><text x="415" y="26" font-size="16" font-weight="700" fill="#222">Neuron</text><text x="615" y="26" font-size="16" font-weight="700" fill="#222">Ausgabe</text><circle cx="90" cy="70" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="90" y="77" font-size="20" font-weight="700" fill="#111" text-anchor="middle">1</text><text x="90" y="116" font-size="13" font-weight="400" fill="#263b43" text-anchor="middle">S: Sonne scheint</text><circle cx="90" cy="165" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="90" y="172" font-size="20" font-weight="700" fill="#111" text-anchor="middle">0</text><text x="90" y="211" font-size="13" font-weight="400" fill="#263b43" text-anchor="middle">F: Freund:innen gehen mit</text><circle cx="90" cy="260" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="90" y="267" font-size="20" font-weight="700" fill="#111" text-anchor="middle">0</text><text x="90" y="306" font-size="13" font-weight="400" fill="#263b43" text-anchor="middle">P: Prüfung morgen</text><line x1="125" y1="70" x2="400" y2="138" stroke="#8d9aa0" stroke-width="2" marker-end="url(#pfeil)"/><rect x="198" y="66" width="56" height="26" rx="6" fill="#fff" opacity="0.95"/><text x="215" y="86" font-size="17" font-weight="700" fill="#8d9aa0">+0</text><line x1="125" y1="165" x2="396" y2="165" stroke="#176c63" stroke-width="3.5" marker-end="url(#pfeil)"/><rect x="198" y="135" width="56" height="26" rx="6" fill="#fff" opacity="0.95"/><text x="215" y="155" font-size="17" font-weight="700" fill="#176c63">+2</text><line x1="125" y1="260" x2="400" y2="192" stroke="#be572b" stroke-width="5" marker-end="url(#pfeil)"/><rect x="198" y="242" width="56" height="26" rx="6" fill="#fff" opacity="0.95"/><text x="215" y="262" font-size="17" font-weight="700" fill="#be572b">−4</text><text x="215" y="306" font-size="13" font-weight="400" fill="#52656a">Negatives Gewicht: spricht dagegen.</text><circle cx="450" cy="165" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="450" y="162" font-size="22" font-weight="700" fill="#1f333c" text-anchor="middle">Σ + b</text><text x="450" y="187" font-size="15" font-weight="400" fill="#263b43" text-anchor="middle">= −1,5</text><text x="450" y="242" font-size="14" font-weight="400" fill="#52656a" text-anchor="middle">Bias b = −1,5</text><text x="450" y="261" font-size="13" font-weight="400" fill="#52656a" text-anchor="middle">(Grundhaltung)</text><line x1="505" y1="165" x2="590" y2="165" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><rect x="600" y="132" width="140" height="66" rx="12" fill="#e3e6e8" stroke="#263b43" stroke-width="1.3"/><text x="670" y="161" font-size="22" font-weight="700" fill="#52656a" text-anchor="middle">Nein</text><text x="670" y="184" font-size="13" font-weight="400" fill="#52656a" text-anchor="middle">y = 0</text></g><rect x="20" y="480" width="760" height="62" rx="12" fill="#e8f4ed" stroke="#97bca8" stroke-width="1.3"/><text x="36" y="505" font-size="17" font-weight="700" fill="#176c63">Lernrate 1  ·  Fehler = Ziel 1 − Ausgabe 0 = +1</text><text x="36" y="531" font-size="17" font-weight="700" fill="#176c63">Korrektur: Sonnengewicht 0 → +1  ·  Bias −1,5 → −0,5</text><text x="25" y="567" font-size="20" font-weight="700" fill="#176c63">2   NACHHER:  korrigierte Vorhersage</text><g transform="translate(20 582)"><rect x="0" y="0" width="760" height="330" rx="10" fill="#fff" stroke="#d3dee3" stroke-width="1.3"/><text x="30" y="26" font-size="16" font-weight="700" fill="#222">Eingaben</text><text x="215" y="26" font-size="16" font-weight="700" fill="#222">Gewichte</text><text x="415" y="26" font-size="16" font-weight="700" fill="#222">Neuron</text><text x="615" y="26" font-size="16" font-weight="700" fill="#222">Ausgabe</text><circle cx="90" cy="70" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="90" y="77" font-size="20" font-weight="700" fill="#111" text-anchor="middle">1</text><text x="90" y="116" font-size="13" font-weight="400" fill="#263b43" text-anchor="middle">S: Sonne scheint</text><circle cx="90" cy="165" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="90" y="172" font-size="20" font-weight="700" fill="#111" text-anchor="middle">0</text><text x="90" y="211" font-size="13" font-weight="400" fill="#263b43" text-anchor="middle">F: Freund:innen gehen mit</text><circle cx="90" cy="260" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="90" y="267" font-size="20" font-weight="700" fill="#111" text-anchor="middle">0</text><text x="90" y="306" font-size="13" font-weight="400" fill="#263b43" text-anchor="middle">P: Prüfung morgen</text><line x1="125" y1="70" x2="400" y2="138" stroke="#176c63" stroke-width="2.75" marker-end="url(#pfeil)"/><rect x="198" y="66" width="56" height="26" rx="6" fill="#fff" opacity="0.95"/><text x="215" y="86" font-size="17" font-weight="700" fill="#176c63">+1</text><line x1="125" y1="165" x2="396" y2="165" stroke="#176c63" stroke-width="3.5" marker-end="url(#pfeil)"/><rect x="198" y="135" width="56" height="26" rx="6" fill="#fff" opacity="0.95"/><text x="215" y="155" font-size="17" font-weight="700" fill="#176c63">+2</text><line x1="125" y1="260" x2="400" y2="192" stroke="#be572b" stroke-width="5" marker-end="url(#pfeil)"/><rect x="198" y="242" width="56" height="26" rx="6" fill="#fff" opacity="0.95"/><text x="215" y="262" font-size="17" font-weight="700" fill="#be572b">−4</text><text x="215" y="306" font-size="13" font-weight="400" fill="#52656a">Negatives Gewicht: spricht dagegen.</text><circle cx="450" cy="165" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="450" y="162" font-size="22" font-weight="700" fill="#1f333c" text-anchor="middle">Σ + b</text><text x="450" y="187" font-size="15" font-weight="400" fill="#263b43" text-anchor="middle">= +0,5</text><rect x="385" y="225" width="132" height="25" rx="7" fill="#e4f3ed" stroke="#7fbea2" stroke-width="1.3"/><text x="450" y="242" font-size="14" font-weight="700" fill="#52656a" text-anchor="middle">Bias b = −0,5</text><text x="450" y="261" font-size="13" font-weight="400" fill="#52656a" text-anchor="middle">(Grundhaltung)</text><line x1="505" y1="165" x2="590" y2="165" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><rect x="600" y="132" width="140" height="66" rx="12" fill="#d7ebe3" stroke="#263b43" stroke-width="1.3"/><text x="670" y="161" font-size="22" font-weight="700" fill="#176c63" text-anchor="middle">Ja</text><text x="670" y="184" font-size="13" font-weight="400" fill="#52656a" text-anchor="middle">y = 1</text></g><text x="25" y="948" font-size="16" font-weight="400" fill="#52656a">Unverändert: Eingaben  ·  Gewichte von F und P  ·  Schwelle bei Summe + Bias = 0</text></svg>