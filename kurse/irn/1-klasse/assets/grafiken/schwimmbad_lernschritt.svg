<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="640" viewBox="0 0 1480 640" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">Lernschritt am Schwimmbad-Neuron: vor und nach der Korrektur</title><desc id="description">Zwei Neuronen nebeneinander: gleiche Eingaben Sonne 1, Freundinnen und Freunde 0, Prüfung morgen 0. Nur Sonnengewicht von null auf plus eins und Bias von minus 1,5 auf minus 0,5 werden geändert. Alle Gewichte stehen unter den Verbindungslinien.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="1480" height="606" rx="15" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="1.5"/><text x="20" y="42" font-size="28" fill="#263b43" font-weight="700" text-anchor="start">Was lernt ein Schwimmbad-Neuron?</text><text x="20" y="75" font-size="19" fill="#263b43" font-weight="700" text-anchor="start">Gleiche Eingaben: Sonne 1 · Freund:innen 0 · Prüfung 0   |   Ziel: Ja (1)</text><g transform="translate(22 96)"><rect x="0" y="0" width="710" height="450" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="21" fill="#263b43" font-weight="700" text-anchor="start">1 · VORHER: Nein (0)</text><line x1="112" y1="103" x2="376" y2="178" fill="none" stroke="#8d9aa0" stroke-width="2" marker-end="url(#arr)"/><line x1="112" y1="206" x2="376" y2="206" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="309" x2="376" y2="234" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="76" cy="103" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="110" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="76" y="152" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="76" cy="206" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="213" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="76" y="255" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="76" cy="309" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="316" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="76" y="358" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="433" cy="206" r="51" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="433" y="201" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="433" y="228" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= −1,5</text><line x1="488" y1="206" x2="566" y2="206" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="576" y="175" width="112" height="66" rx="11" fill="#e3e6e8" stroke="#263b43" stroke-width="1.5"/><text x="632" y="203" font-size="20" fill="#52656a" font-weight="700" text-anchor="middle">Nein</text><text x="632" y="227" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 0</text><rect x="14" y="385" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="25" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Sonne</text><text x="25" y="421" font-size="16" fill="#8d9aa0" font-weight="700" text-anchor="start">w = +0</text><rect x="187" y="385" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="198" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Freund:innen</text><text x="198" y="421" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +2</text><rect x="360" y="385" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="371" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Prüfung</text><text x="371" y="421" font-size="16" fill="#be572b" font-weight="700" text-anchor="start">w = −4</text><rect x="533" y="385" width="162" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="544" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Bias</text><text x="544" y="421" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">b = −1,5</text></g><g transform="translate(748 96)"><rect x="0" y="0" width="710" height="425" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="21" fill="#176c63" font-weight="700" text-anchor="start">2 · NACHHER: Ja (1)</text><line x1="112" y1="103" x2="376" y2="178" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="206" x2="376" y2="206" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="309" x2="376" y2="234" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="76" cy="103" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="110" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="76" y="152" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="76" cy="206" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="213" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="76" y="255" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="76" cy="309" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="316" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="76" y="358" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="433" cy="206" r="51" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="433" y="201" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="433" y="228" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= +0,5</text><line x1="488" y1="206" x2="566" y2="206" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="576" y="175" width="112" height="66" rx="11" fill="#d7ebe3" stroke="#263b43" stroke-width="1.5"/><text x="632" y="203" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="632" y="227" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><rect x="14" y="385" width="164" height="43" rx="9" fill="#e9f7ef" stroke="#8cbba2" stroke-width="1.5"/><text x="25" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Sonne</text><text x="25" y="421" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +1</text><rect x="187" y="385" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="198" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Freund:innen</text><text x="198" y="421" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +2</text><rect x="360" y="385" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="371" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Prüfung</text><text x="371" y="421" font-size="16" fill="#be572b" font-weight="700" text-anchor="start">w = −4</text><rect x="533" y="385" width="162" height="43" rx="9" fill="#e9f7ef" stroke="#8cbba2" stroke-width="1.5"/><text x="544" y="402" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Bias</text><text x="544" y="421" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">b = −0,5</text></g><rect x="22" y="574" width="1436" height="47" rx="11" fill="#e9f7ef" stroke="#abcdb7" stroke-width="1.5"/><text x="42" y="603" font-size="19" fill="#176c63" font-weight="700" text-anchor="start">Lernrate 1 · Fehler +1 → Sonnengewicht 0 → +1 und Bias −1,5 → −0,5. Alle anderen Werte bleiben gleich.</text></svg>