<svg xmlns="http://www.w3.org/2000/svg" width="450" height="990" viewBox="0 0 450 990" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">Mobil: Lernschritt am Schwimmbad-Neuron</title><desc id="description">Unter der Vorher-Grafik folgt die Nachher-Grafik. Sonne 1, Freundinnen und Freunde 0, Prüfung 0. Nur das Sonnengewicht und der Bias ändern sich.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="450" height="990" rx="15" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="1.5"/><text x="14" y="37" font-size="22" fill="#263b43" font-weight="700" text-anchor="start">Was lernt das Schwimmbad-Neuron?</text><text x="14" y="65" font-size="16" fill="#52656a" font-weight="400" text-anchor="start">Gleiche Eingaben S=1, F=0, P=0</text><g transform="translate(0 82)"><rect x="0" y="0" width="450" height="404" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="20" fill="#263b43" font-weight="700" text-anchor="start">1 · VORHER</text><line x1="85" y1="120" x2="245" y2="198" fill="none" stroke="#8d9aa0" stroke-width="2" marker-end="url(#arr)"/><line x1="85" y1="227" x2="245" y2="226" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="85" y1="334" x2="245" y2="254" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="51" cy="120" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="127" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="51" y="167" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="51" cy="227" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="234" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="51" y="274" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="51" cy="334" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="341" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="51" y="381" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="298" cy="226" r="47" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="298" y="221" font-size="20" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="298" y="248" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= −1,5</text><line x1="349" y1="226" x2="368" y2="226" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="378" y="195" width="66" height="66" rx="11" fill="#e3e6e8" stroke="#263b43" stroke-width="1.5"/><text x="411" y="223" font-size="17" fill="#52656a" font-weight="700" text-anchor="middle">Nein</text><text x="411" y="247" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 0</text><text class="line-weight" x="175" y="145" font-size="15" fill="#626e75" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +0</text><text class="line-weight" x="166" y="216" font-size="15" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +2</text><text class="line-weight" x="175" y="310" font-size="15" fill="#be572b" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = −4</text><text class="neuron-bias" x="298" y="307" font-size="16" fill="#263b43" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">b = −1,5</text></g><rect x="12" y="495" width="426" height="61" rx="11" fill="#e9f7ef" stroke="#abcdb7" stroke-width="1.5"/><text x="25" y="522" font-size="17" fill="#176c63" font-weight="700" text-anchor="start">Fehler +1  →  Lernrate 1</text><text x="25" y="547" font-size="15" fill="#176c63" font-weight="700" text-anchor="start">Sonnengewicht 0 → +1, Bias −1,5 → −0,5</text><g transform="translate(0 566)"><rect x="0" y="0" width="450" height="404" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="20" fill="#176c63" font-weight="700" text-anchor="start">2 · NACHHER</text><line x1="85" y1="120" x2="245" y2="198" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="85" y1="227" x2="245" y2="226" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="85" y1="334" x2="245" y2="254" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="51" cy="120" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="127" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="51" y="167" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="51" cy="227" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="234" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="51" y="274" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="51" cy="334" r="28" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="51" y="341" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="51" y="381" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="298" cy="226" r="47" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="298" y="221" font-size="20" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="298" y="248" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= +0,5</text><line x1="349" y1="226" x2="368" y2="226" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="378" y="195" width="66" height="66" rx="11" fill="#d7ebe3" stroke="#263b43" stroke-width="1.5"/><text x="411" y="223" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="411" y="247" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><text class="line-weight" x="175" y="145" font-size="15" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="166" y="216" font-size="15" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +2</text><text class="line-weight" x="175" y="310" font-size="15" fill="#be572b" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = −4</text><text class="neuron-bias" x="298" y="307" font-size="16" fill="#263b43" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">b = −0,5</text></g></svg>