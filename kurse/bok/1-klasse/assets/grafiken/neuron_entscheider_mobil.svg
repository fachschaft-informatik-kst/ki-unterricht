<svg xmlns="http://www.w3.org/2000/svg" width="450" height="540" viewBox="0 0 450 540" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">Schwimmbad-Neuron mobil</title><desc id="description">Drei Eingaben Sonne 1, Freundinnen und Freunde 0, Prüfung morgen 1. Alle Gewichte und der Bias stehen lesbar unter den Verbindungen.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><text x="16" y="33" font-size="23" fill="#263b43" font-weight="700" text-anchor="start">Schwimmbad: drei Eingaben</text><g transform="translate(0 45)"><rect x="0" y="0" width="710" height="425" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="21" fill="#263b43" font-weight="700" text-anchor="start">Gewichte und Bias</text><line x1="112" y1="103" x2="376" y2="178" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="206" x2="376" y2="206" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="309" x2="376" y2="234" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="76" cy="103" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="110" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="76" y="152" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="76" cy="206" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="213" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="76" y="255" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="76" cy="309" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="316" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="76" y="358" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="433" cy="206" r="51" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="433" y="201" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="433" y="228" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= −3</text><line x1="488" y1="206" x2="566" y2="206" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="576" y="175" width="112" height="66" rx="11" fill="#e3e6e8" stroke="#263b43" stroke-width="1.5"/><text x="632" y="203" font-size="20" fill="#52656a" font-weight="700" text-anchor="middle">Nein</text><text x="632" y="227" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 0</text><rect x="14" y="357" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="25" y="374" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Sonne</text><text x="25" y="393" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +2</text><rect x="187" y="357" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="198" y="374" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Freund:innen</text><text x="198" y="393" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">w = +2</text><rect x="360" y="357" width="164" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="371" y="374" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Prüfung</text><text x="371" y="393" font-size="16" fill="#be572b" font-weight="700" text-anchor="start">w = −4</text><rect x="533" y="357" width="162" height="43" rx="9" fill="#ffffff" stroke="#cbdbe1" stroke-width="1.5"/><text x="544" y="374" font-size="13" fill="#52656a" font-weight="700" text-anchor="start">Bias</text><text x="544" y="393" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">b = −1</text></g><text x="16" y="528" font-size="15" fill="#52656a" font-weight="400" text-anchor="start">Prüfung morgen = 1 wirkt mit Gewicht −4.</text></svg>