<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="Arial,Helvetica,sans-serif" role="img" aria-labelledby="title description">
<title id="title">Ein Schwimmbad-Neuron macht bei XOR einen Fehler</title>
<desc id="description">Nur zwei Eingaben: Sonne 1 und Freundinnen und Freunde 1, bei Prüfung 0. Das Beispielneuron mit beiden Gewichten 1 und Bias minus 0,5 liefert 1, obwohl die künstliche XOR-Regel in diesem Fall 0 verlangt. In einer Tabelle sind alle vier Fälle dargestellt: drei richtig, einer falsch. Das ist nur eine Beispielkonfiguration, die geometrische Punktgrafik darunter zeigt das grundsätzliche Problem.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#536b79"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#24826e"/></marker></defs>
<rect width="1200" height="440" rx="18" fill="#f3f8fa"/>
<text x="32" y="43" fill="#173f52" font-size="26" font-weight="800" text-anchor="start">Ein Neuron versucht die neue XOR-Schwimmbadregel</text>
<text x="32" y="73" fill="#526b79" font-size="17" font-weight="400" text-anchor="start">Beispiel-Einstellung: wS = +1 · wF = +1 · Bias = −0,5    (Prüfung bleibt 0)</text>
<rect x="25" y="104" width="720" height="288" rx="16" fill="#ffffff" stroke="#cddce3"/>
<text x="77" y="142" fill="#435b68" font-size="17" font-weight="700" text-anchor="start">Eingaben</text>
<text x="378" y="142" fill="#435b68" font-size="17" font-weight="700" text-anchor="start">Neuron</text>
<text x="609" y="142" fill="#435b68" font-size="17" font-weight="700" text-anchor="start">Ausgabe</text>
<g fill="none" stroke="#7895a7" stroke-width="3" marker-end="url(#arrow)"><path d="M224 217 L364 240"/><path d="M224 316 L364 261"/><path d="M461 248 L543 248"/></g>
<circle cx="92" cy="217" r="30" fill="#eaf2f8" stroke="#6289a7" stroke-width="2"/>
<circle cx="92" cy="317" r="30" fill="#eaf2f8" stroke="#6289a7" stroke-width="2"/>
<text x="92" y="224" fill="#24536e" font-size="22" font-weight="800" text-anchor="middle">1</text><text x="92" y="324" fill="#24536e" font-size="22" font-weight="800" text-anchor="middle">1</text>
<text x="145" y="218" fill="#233f4d" font-size="19" font-weight="700" text-anchor="start">Sonne</text><text x="145" y="316" fill="#233f4d" font-size="19" font-weight="700" text-anchor="start">Freund:innen</text>
<rect x="278" y="174" width="82" height="31" rx="10" fill="#fff" stroke="#cddce3"/><text x="319" y="195" fill="#3b5d6e" font-size="16" font-weight="700" text-anchor="middle">w = +1</text><rect x="278" y="303" width="82" height="31" rx="10" fill="#fff" stroke="#cddce3"/><text x="319" y="324" fill="#3b5d6e" font-size="16" font-weight="700" text-anchor="middle">w = +1</text>
<circle cx="414" cy="248" r="51" fill="#e2f0e8" stroke="#4d947a" stroke-width="3"/>
<text x="414" y="241" fill="#20614f" font-size="22" font-weight="800" text-anchor="middle">Σ + b</text><text x="414" y="266" fill="#20614f" font-size="17" font-weight="600" text-anchor="middle">= +1,5</text>
<text x="414" y="329" fill="#516875" font-size="17" font-weight="600" text-anchor="middle">b = −0,5</text>
<rect x="554" y="207" width="163" height="83" rx="12" fill="#fde9e6" stroke="#d6867e" stroke-width="2"/>
<text x="636" y="240" fill="#a3493d" font-size="23" font-weight="800" text-anchor="middle">JA (1)</text><text x="636" y="268" fill="#a3493d" font-size="17" font-weight="700" text-anchor="middle">Ziel: NEIN (0)</text>
<rect x="775" y="104" width="398" height="288" rx="16" fill="#ffffff" stroke="#cddce3"/>
<text x="795" y="140" fill="#173f52" font-size="20" font-weight="800" text-anchor="start">Vier Situationen</text>
<text x="800" y="173" fill="#526b79" font-size="16" font-weight="700" text-anchor="start">S / F</text><text x="933" y="173" fill="#526b79" font-size="16" font-weight="700" text-anchor="start">Neuron</text><text x="1072" y="173" fill="#526b79" font-size="16" font-weight="700" text-anchor="start">XOR-Ziel</text>
<g font-size="18" font-weight="700" text-anchor="middle" fill="#293e49">
<text x="838" y="210">0 / 0</text><text x="964" y="210">0</text><text x="1104" y="210">0 ✓</text>
<text x="838" y="258">0 / 1</text><text x="964" y="258">1</text><text x="1104" y="258">1 ✓</text>
<text x="838" y="306">1 / 0</text><text x="964" y="306">1</text><text x="1104" y="306">1 ✓</text></g>
<rect x="788" y="321" width="370" height="49" rx="9" fill="#fde9e6"/>
<text x="838" y="353" fill="#993d36" font-size="18" font-weight="800" text-anchor="middle">1 / 1</text><text x="964" y="353" fill="#993d36" font-size="18" font-weight="800" text-anchor="middle">1</text><text x="1104" y="353" fill="#993d36" font-size="18" font-weight="800" text-anchor="middle">0 ✗</text>
<text x="600" y="423" fill="#435e6c" font-size="17" font-weight="500" text-anchor="middle">Diese Einstellung schafft 3 von 4. Warum kein einzelnes Neuron 4 von 4 schafft, zeigt die Punktgrafik darunter.</text>
</svg>