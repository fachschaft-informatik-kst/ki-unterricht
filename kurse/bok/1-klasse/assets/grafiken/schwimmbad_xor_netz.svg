<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">Schwimmbad-Netz: XOR mit hemmendem Prüfungseingang</title><desc id="description">Sonne 1, Freundinnen und Freunde 0, Prüfung morgen 1. OR und NAND liefern jeweils 1. Das Prüfungsgewicht -2 bremst das Ausgabeneuron; seine Summe ist -1.5 und die Ausgabe Nein. Bei Prüfung 0 wäre sie Ja.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="1240" height="650" rx="14" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="1.5"/><text x="25" y="43" font-size="28" fill="#263b43" font-weight="700" text-anchor="start">Ein echtes Schwimmbadnetz: drei Eingaben</text><text x="25" y="76" font-size="19" fill="#52656a" font-weight="400" text-anchor="start">OR + NAND bilden XOR. Prüfung morgen hemmt zusätzlich die Ausgabe.</text><line x1="149" y1="177" x2="462" y2="177" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="149" y1="335" x2="463" y2="203" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="149" y1="177" x2="464" y2="331" fill="none" stroke="#be572b" stroke-width="3" marker-end="url(#arr)"/><line x1="149" y1="335" x2="462" y2="355" fill="none" stroke="#be572b" stroke-width="3" marker-end="url(#arr)"/><line x1="579" y1="180" x2="890" y2="268" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="579" y1="355" x2="890" y2="315" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><path d="M 150 520 L 791 520 L 893 336" fill="none" stroke="#be572b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="110" cy="177" r="34" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="110" y="184" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="110" y="230" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="110" cy="335" r="34" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="110" y="342" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="110" y="388" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="110" cy="520" r="34" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="110" y="527" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="110" y="573" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="520" cy="180" r="57" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="520" y="174" font-size="23" fill="#176c63" font-weight="700" text-anchor="middle">OR</text><text x="520" y="202" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="520" y="261" font-size="15" fill="#52656a" font-weight="400" text-anchor="middle">b = −0,5</text><circle cx="520" cy="355" r="57" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="520" y="349" font-size="23" fill="#176c63" font-weight="700" text-anchor="middle">NAND</text><text x="520" y="377" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="520" y="436" font-size="15" fill="#52656a" font-weight="400" text-anchor="middle">b = +1,5</text><circle cx="947" cy="291" r="57" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="947" y="276" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">Ausgang</text><text x="947" y="300" font-size="17" fill="#263b43" font-weight="700" text-anchor="middle">Σ+b</text><text x="947" y="323" font-size="16" fill="#be572b" font-weight="700" text-anchor="middle">−1,5 → 0</text><line x1="1009" y1="291" x2="1090" y2="291" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="1100" y="254" width="122" height="73" rx="13" fill="#e3e6e8" stroke="#263b43" stroke-width="1.5"/><text x="1161" y="284" font-size="23" fill="#52656a" font-weight="700" text-anchor="middle">Nein</text><text x="1161" y="310" font-size="17" fill="#52656a" font-weight="400" text-anchor="middle">y = 0</text><text x="24" y="627" font-size="18" fill="#263b43" font-weight="700" text-anchor="start">P = 0: 1 + 1 − 0 − 1,5 = +0,5 → Ja     |     P = 1: 1 + 1 − 2 − 1,5 = −1,5 → Nein</text><text class="line-weight" x="288" y="156" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="220" y="291" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="244" y="210" font-size="20" fill="#be572b" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = −1</text><text class="line-weight" x="334" y="373" font-size="20" fill="#be572b" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = −1</text><text class="line-weight" x="738" y="210" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="720" y="358" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="598" y="503" font-size="21" fill="#be572b" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = −2</text><text class="neuron-bias" x="947" y="380" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">b = −1,5</text></svg>