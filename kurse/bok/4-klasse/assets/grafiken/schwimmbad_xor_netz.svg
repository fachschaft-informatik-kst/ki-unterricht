<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="783" viewBox="0 0 1320 783" font-family="Helvetica,Arial,sans-serif" font-size="15" role="img" aria-labelledby="titel beschreibung"><title id="titel">Schwimmbad-XOR-Netz mit Hidden Layer</title><desc id="beschreibung">Sonne 1 und Freund:innen 0 erreichen zwei Zwischenneuronen mit den Funktionen OR und NAND. Beide ergeben 1. Das letzte Neuron AND verbindet die Zwischenwerte und liefert Ja 1. Die Gewichte und Bias sind auf jedem Pfad eingezeichnet.</desc><defs><marker id="pfeil" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="1" y="1" width="1318" height="780" rx="16" fill="#f8fafb" stroke="#eff4f7" stroke-width="1.3"/><text x="25" y="47" font-size="27" font-weight="700" fill="#173c4e">Schwimmbad-XOR: das Netz mit versteckter Schicht</text><text x="25" y="81" font-size="18" font-weight="400" fill="#355663">Sonne S = 1 · Freund:innen F = 0 · Prüfung P = 0  →  Ziel: Ja (1)</text><text x="70" y="132" font-size="18" font-weight="700" fill="#263b43">Eingaben</text><text x="302" y="132" font-size="18" font-weight="700" fill="#263b43">Gewichte</text><text x="508" y="132" font-size="18" font-weight="700" fill="#263b43">Hidden Layer</text><text x="811" y="132" font-size="18" font-weight="700" fill="#263b43">Gewichte</text><text x="922" y="132" font-size="18" font-weight="700" fill="#263b43">Neuron</text><text x="1139" y="132" font-size="18" font-weight="700" fill="#263b43">Ausgabe</text><rect x="474" y="157" width="164" height="468" rx="16" fill="#fff9f0" stroke="#efe0c3" stroke-width="1.3"/><circle cx="106" cy="262" r="34" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="106" y="270" font-size="23" font-weight="700" fill="#1a303b" text-anchor="middle">1</text><text x="106" y="323" font-size="16" font-weight="400" fill="#263b43" text-anchor="middle">S: Sonne</text><circle cx="106" cy="522" r="34" fill="#eaf1f8" stroke="#30628c" stroke-width="1.5"/><text x="106" y="530" font-size="23" font-weight="700" fill="#1a303b" text-anchor="middle">0</text><text x="106" y="583" font-size="16" font-weight="400" fill="#263b43" text-anchor="middle">F: Freund:innen</text><line x1="145" y1="262" x2="498" y2="262" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="145" y1="522" x2="507" y2="297" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="145" y1="262" x2="507" y2="487" stroke="#be572b" stroke-width="3" marker-end="url(#pfeil)"/><line x1="145" y1="522" x2="498" y2="522" stroke="#be572b" stroke-width="3" marker-end="url(#pfeil)"/><line x1="611" y1="284" x2="904" y2="368" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="611" y1="497" x2="904" y2="414" stroke="#176c63" stroke-width="3" marker-end="url(#pfeil)"/><line x1="1027" y1="392" x2="1125" y2="392" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><rect x="308" y="225" width="55" height="29" rx="7" fill="#fff" stroke="#176c63" stroke-width="1.3"/><text x="335.5" y="247" font-size="16" font-weight="700" fill="#176c63" text-anchor="middle">+1</text><rect x="407" y="318" width="55" height="29" rx="7" fill="#fff" stroke="#176c63" stroke-width="1.3"/><text x="434.5" y="340" font-size="16" font-weight="700" fill="#176c63" text-anchor="middle">+1</text><rect x="407" y="438" width="55" height="29" rx="7" fill="#fff" stroke="#be572b" stroke-width="1.3"/><text x="434.5" y="460" font-size="16" font-weight="700" fill="#be572b" text-anchor="middle">−1</text><rect x="308" y="530" width="55" height="29" rx="7" fill="#fff" stroke="#be572b" stroke-width="1.3"/><text x="335.5" y="552" font-size="16" font-weight="700" fill="#be572b" text-anchor="middle">−1</text><rect x="755" y="284" width="55" height="29" rx="7" fill="#fff" stroke="#176c63" stroke-width="1.3"/><text x="782.5" y="306" font-size="16" font-weight="700" fill="#176c63" text-anchor="middle">+1</text><rect x="755" y="485" width="55" height="29" rx="7" fill="#fff" stroke="#176c63" stroke-width="1.3"/><text x="782.5" y="507" font-size="16" font-weight="700" fill="#176c63" text-anchor="middle">+1</text><circle cx="557" cy="262" r="57" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="557" y="251" font-size="22" font-weight="700" fill="#175d52" text-anchor="middle">OR</text><text x="557" y="276" font-size="15" font-weight="400" fill="#263b43" text-anchor="middle">Σ + b</text><text x="557" y="299" font-size="15" font-weight="700" fill="#263b43" text-anchor="middle">= +0,5 → 1</text><text x="557" y="349" font-size="15" font-weight="400" fill="#52656a" text-anchor="middle">Bias b = −0,5</text><circle cx="557" cy="522" r="57" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="557" y="511" font-size="21" font-weight="700" fill="#175d52" text-anchor="middle">NAND</text><text x="557" y="535" font-size="15" font-weight="400" fill="#263b43" text-anchor="middle">Σ + b</text><text x="557" y="558" font-size="15" font-weight="700" fill="#263b43" text-anchor="middle">= +0,5 → 1</text><text x="557" y="610" font-size="15" font-weight="400" fill="#52656a" text-anchor="middle">Bias b = +1,5</text><circle cx="969" cy="392" r="60" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="969" y="378" font-size="23" font-weight="700" fill="#175d52" text-anchor="middle">AND</text><text x="969" y="404" font-size="16" font-weight="400" fill="#263b43" text-anchor="middle">Σ + b</text><text x="969" y="427" font-size="15" font-weight="700" fill="#263b43" text-anchor="middle">= +0,5 → 1</text><text x="969" y="486" font-size="15" font-weight="400" fill="#52656a" text-anchor="middle">Bias b = −1,5</text><rect x="1129" y="348" width="156" height="92" rx="12" fill="#d7ebe3" stroke="#263b43" stroke-width="1.3"/><text x="1207" y="379" font-size="25" font-weight="700" fill="#176c63" text-anchor="middle">Ja</text><text x="1207" y="409" font-size="16" font-weight="400" fill="#263b43" text-anchor="middle">Schwimmen? 1</text><rect x="22" y="643" width="1275" height="110" rx="12" fill="#ffffff" stroke="#cbd9e1" stroke-width="1.3"/><text x="45" y="676" font-size="16" font-weight="700" fill="#175d52">OR  (+1, +1; b = −0,5)  →  1</text><text x="465" y="676" font-size="16" font-weight="700" fill="#175d52">NAND  (−1, −1; b = +1,5)  →  1</text><text x="921" y="676" font-size="16" font-weight="700" fill="#175d52">AND (1, 1; b = −1,5)  →  1</text><text x="45" y="712" font-size="17" font-weight="400" fill="#3a5867">Die beiden Zwischenneuronen arbeiten gleichzeitig. Das Ausgabeneuron verknüpft beide Ergebnisse.</text><text x="659" y="768" font-size="16" font-weight="400" fill="#52656a" text-anchor="middle">Das Beispiel ergibt XOR = Ja (1). Die Tabelle darunter zeigt die übrigen drei Fälle.</text></svg>