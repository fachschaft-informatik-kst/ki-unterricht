<svg xmlns="http://www.w3.org/2000/svg" width="450" height="708" viewBox="0 0 450 708" font-family="Arial,Helvetica,sans-serif" role="img" aria-labelledby="title desc"><title id="title">XOR: vier Schwimmbadfälle und keine trennende Gerade</title><desc id="desc">Mobilansicht: Oben XOR-Wahrheitstabelle für Sonne und Freundinnen und Freunde, unten vier Punkte. Zwei Ja-Punkte liegen diagonal gegenüber und keine gerade Linie trennt Ja von Nein.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="450" height="708" rx="14" fill="#f5f8fa" stroke="#f5f8fa"/><text x="18" y="36" font-size="22" fill="#173e50" font-weight="700" text-anchor="start">XOR: die vier Schwimmbadfälle</text><text x="18" y="69" font-size="16" fill="#52656a" font-weight="400" text-anchor="start">1 = Ja · 0 = Nein · Prüfung bleibt 0</text><rect x="18" y="85" width="414" height="267" rx="11" fill="#fff" stroke="#cad9e1"/><text x="30" y="114" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">Sonne</text><text x="176" y="114" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">Freund:innen</text><text x="361" y="114" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">XOR</text><rect x="25" y="129" width="400" height="49" rx="7" fill="#e9f0fa" stroke="none"/><text x="65" y="163" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="234" y="163" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="373" y="163" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">0</text><rect x="25" y="184" width="400" height="49" rx="7" fill="#f8e9e7" stroke="none"/><text x="65" y="218" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="234" y="218" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="373" y="218" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">1</text><rect x="25" y="239" width="400" height="49" rx="7" fill="#f8e9e7" stroke="none"/><text x="65" y="273" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="234" y="273" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="373" y="273" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">1</text><rect x="25" y="294" width="400" height="49" rx="7" fill="#e9f0fa" stroke="none"/><text x="65" y="328" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="234" y="328" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="373" y="328" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="18" y="385" font-size="17" fill="#173e50" font-weight="700" text-anchor="start">XOR als Punkte: diagonal liegen die Ja-Fälle</text><rect x="75" y="411" width="319" height="224" rx="6" fill="#fff" stroke="#bfcdd5"/><text x="234" y="666" font-size="16" fill="#52656a" font-weight="400" text-anchor="middle">Sonne (0 oder 1) →</text><text x="21" y="514" font-size="18" fill="#52656a" font-weight="700" text-anchor="start">F</text><text x="21" y="536" font-size="20" fill="#52656a" font-weight="700" text-anchor="start">↑</text><g stroke="#9aabb4" stroke-width="2" stroke-dasharray="7 6"><line x1="235" y1="412" x2="235" y2="634"/><line x1="76" y1="523" x2="393" y2="523"/><line x1="83" y1="431" x2="379" y2="618"/></g><circle cx="126" cy="589" r="23" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="126" y="595" font-size="17" fill="#263b43" font-weight="700" text-anchor="middle">00</text><circle cx="126" cy="460" r="23" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="126" y="466" font-size="17" fill="#263b43" font-weight="700" text-anchor="middle">01</text><circle cx="341" cy="589" r="23" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="341" y="595" font-size="17" fill="#263b43" font-weight="700" text-anchor="middle">10</text><circle cx="341" cy="460" r="23" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="341" y="466" font-size="17" fill="#263b43" font-weight="700" text-anchor="middle">11</text><text x="225" y="691" font-size="16" fill="#52656a" font-weight="400" text-anchor="middle">Rot: Ja (1) · Blau: Nein (0)</text></svg>