<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">XOR-Versuch mit dem vollständigen Schwimmbad-Neuron</title><desc id="description">Sonne 1, Freundinnen und Freunde 1 und Prüfung morgen 0; Gewichte +1,+1,-2 und Bias -0.5. Das Neuron sagt Ja, aber XOR verlangt Nein. Bei Prüfung 1 wirkt das negative Gewicht -2.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><g transform="translate(20 18) scale(1.02)"><rect x="0" y="0" width="710" height="390" rx="13" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="15" y="28" font-size="21" fill="#263b43" font-weight="700" text-anchor="start">Ein Neuron versucht XOR (P = 0)</text><line x1="112" y1="103" x2="376" y2="178" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="206" x2="376" y2="206" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="112" y1="309" x2="376" y2="234" fill="none" stroke="#be572b" stroke-width="4" marker-end="url(#arr)"/><circle cx="76" cy="103" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="110" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="76" y="152" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="76" cy="206" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="213" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="76" y="255" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="76" cy="309" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="76" y="316" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="76" y="358" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="433" cy="206" r="51" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="433" y="201" font-size="21" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="433" y="228" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= +1,5</text><line x1="488" y1="206" x2="566" y2="206" fill="none" stroke="#263b43" stroke-width="2.5" marker-end="url(#arr)"/><rect x="576" y="175" width="112" height="66" rx="11" fill="#d7ebe3" stroke="#263b43" stroke-width="1.5"/><text x="632" y="203" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="632" y="227" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><text x="395" y="336" font-size="15" fill="#be572b" font-weight="700" text-anchor="start">XOR-Ziel: Nein (0)  · Fehler</text></g><text x="20" y="444" font-size="15" fill="#52656a" font-weight="400" text-anchor="start">Für P = 1 würde das Prüfungsgewicht −2 die Entscheidung hemmen.</text><text class="line-weight" x="240" y="122" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="241" y="193" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = +1</text><text class="line-weight" x="244" y="291" font-size="20" fill="#be572b" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">w = −2</text><text class="neuron-bias" x="433" y="291" font-size="19" fill="#263b43" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">b = −0,5</text></svg>