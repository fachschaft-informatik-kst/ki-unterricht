<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 716" width="450" height="716" font-family="Arial,Helvetica,sans-serif" role="img" aria-labelledby="title desc"><title id="title">Schwimmbad-XOR-Netz mit Hidden Layer</title><desc id="desc">Mobile Ansicht: Sonne 1, Freundinnen und Freunde 0 speisen zwei Hidden-Layer-Neuronen OR und NAND, diese liefern jeweils 1. Das AND-Neuron liefert Ja 1. Prüfung morgen 0 ist als feste, hier nicht verbundene Eingabe sichtbar.</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="450" height="716" rx="15" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="0"/><text x="15" y="32" font-size="23" fill="#173e50" font-weight="700" text-anchor="start">XOR mit Hidden Layer</text><text x="15" y="59" font-size="15" fill="#263b43" font-weight="400" text-anchor="start">Sonne 1 · Freund:innen 0 · Prüfung 0</text><text x="25" y="96" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Eingaben</text><text x="176" y="96" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Zwischenschicht</text><text x="345" y="96" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Ausgabe</text><line x1="93" y1="188" x2="178" y2="188" stroke="#176c63" stroke-width="3" marker-end="url(#arrow)"/><line x1="93" y1="378" x2="182" y2="215" stroke="#176c63" stroke-width="3" marker-end="url(#arrow)"/><line x1="93" y1="188" x2="182" y2="366" stroke="#be572b" stroke-width="3" marker-end="url(#arrow)"/><line x1="93" y1="378" x2="178" y2="390" stroke="#be572b" stroke-width="3" marker-end="url(#arrow)"/><line x1="277" y1="188" x2="325" y2="277" stroke="#176c63" stroke-width="3" marker-end="url(#arrow)"/><line x1="277" y1="390" x2="326" y2="327" stroke="#176c63" stroke-width="3" marker-end="url(#arrow)"/><line x1="411" y1="302" x2="435" y2="302" stroke="#263b43" stroke-width="2.6" marker-end="url(#arrow)"/><circle cx="55" cy="188" r="32" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="55" y="196" font-size="23" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="55" y="242" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="55" cy="378" r="32" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="55" y="386" font-size="23" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="55" y="432" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="228" cy="188" r="49" fill="#cfe8dc" stroke="#263b43" stroke-width="2.4"/><text x="228" y="181" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle">OR</text><text x="228" y="204" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="228" y="261" font-size="14" fill="#176c63" font-weight="700" text-anchor="middle">w: +1, +1</text><text x="228" y="280" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">b = −0,5</text><circle cx="228" cy="390" r="49" fill="#cfe8dc" stroke="#263b43" stroke-width="2.4"/><text x="228" y="383" font-size="19" fill="#176c63" font-weight="700" text-anchor="middle">NAND</text><text x="228" y="406" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="228" y="465" font-size="14" fill="#be572b" font-weight="700" text-anchor="middle">w: −1, −1</text><text x="228" y="484" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">b = +1,5</text><circle cx="370" cy="302" r="42" fill="#cfe8dc" stroke="#263b43" stroke-width="2.4"/><text x="370" y="298" font-size="19" fill="#176c63" font-weight="700" text-anchor="middle">AND</text><text x="370" y="320" font-size="17" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="370" y="375" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">b = −1,5</text><text x="370" y="400" font-size="14" fill="#176c63" font-weight="700" text-anchor="middle">w: +1, +1</text><text x="378" y="452" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">Ja (1)</text><rect x="15" y="527" width="420" height="62" rx="11" fill="#eef4f7" stroke="#d1dfe5" stroke-width="1.2"/><text x="29" y="550" font-size="17" fill="#263b43" font-weight="700" text-anchor="start">Prüfung morgen = 0</text><text x="29" y="574" font-size="14" fill="#52656a" font-weight="400" text-anchor="start">Hier nicht verbunden; XOR nutzt S und F.</text><rect x="15" y="601" width="420" height="83" rx="11" fill="#e9f5ee" stroke="#b8d7c5" stroke-width="1.2"/><text x="29" y="626" font-size="17" fill="#176c63" font-weight="700" text-anchor="start">OR = 1  ·  NAND = 1</text><text x="29" y="651" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">AND(1, 1) = 1  →  Schwimmen: Ja</text><text x="15" y="706" font-size="14" fill="#52656a" font-weight="400" text-anchor="start">Die vier Fälle stehen in der Tabelle darunter.</text></svg>