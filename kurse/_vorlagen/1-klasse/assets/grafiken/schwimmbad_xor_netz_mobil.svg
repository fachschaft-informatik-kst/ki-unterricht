<svg xmlns="http://www.w3.org/2000/svg" width="450" height="930" viewBox="0 0 450 930" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description"><title id="title">XOR-Schwimmbadnetz mobil mit Prüfung als echter Eingabe</title><desc id="description">Sonne 1 und Freundinnen und Freunde 0 liefern OR 1 und NAND 1. Prüfung 1 geht mit negativem Gewicht -2 direkt zum Ausgabeneuron und verhindert das Schwimmen. Die Gewichtszahlen stehen in eigenen Tabellen unterhalb der Verbindungen.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="450" height="930" rx="14" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="1.5"/><text x="15" y="34" font-size="22" fill="#263b43" font-weight="700" text-anchor="start">Hidden Layer + Prüfungsbremse</text><text x="15" y="62" font-size="15" fill="#52656a" font-weight="400" text-anchor="start">Sonne = 1 · Freund:innen = 0 · Prüfung = 1</text><line x1="91" y1="156" x2="173" y2="156" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="91" y1="319" x2="175" y2="183" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="91" y1="156" x2="177" y2="293" fill="none" stroke="#be572b" stroke-width="3" marker-end="url(#arr)"/><line x1="91" y1="319" x2="173" y2="319" fill="none" stroke="#be572b" stroke-width="3" marker-end="url(#arr)"/><line x1="271" y1="156" x2="321" y2="402" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><line x1="271" y1="319" x2="321" y2="421" fill="none" stroke="#176c63" stroke-width="3" marker-end="url(#arr)"/><path d="M 92 506 L 292 506 L 319 460" fill="none" stroke="#be572b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="55" cy="156" r="31" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="55" y="163" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="55" y="206" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Sonne</text><circle cx="55" cy="319" r="31" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="55" y="326" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">0</text><text x="55" y="369" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Freund:innen</text><circle cx="55" cy="506" r="31" fill="#eaf1f8" stroke="#30628c" stroke-width="2"/><text x="55" y="513" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">1</text><text x="55" y="556" font-size="14" fill="#263b43" font-weight="400" text-anchor="middle">Prüfung morgen</text><circle cx="224" cy="156" r="48" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="224" y="150" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle">OR</text><text x="224" y="177" font-size="20" fill="#263b43" font-weight="700" text-anchor="middle">1</text><circle cx="224" cy="319" r="48" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="224" y="313" font-size="20" fill="#176c63" font-weight="700" text-anchor="middle">NAND</text><text x="224" y="340" font-size="20" fill="#263b43" font-weight="700" text-anchor="middle">1</text><circle cx="361" cy="430" r="43" fill="#cfe8dc" stroke="#263b43" stroke-width="2"/><text x="361" y="423" font-size="16" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="361" y="448" font-size="15" fill="#be572b" font-weight="700" text-anchor="middle">−1,5</text><text x="355" y="496" font-size="16" fill="#be572b" font-weight="700" text-anchor="middle">Nein (0)</text><text x="15" y="582" font-size="15" fill="#52656a" font-weight="700" text-anchor="start">Die Gewichte stehen unterhalb der Verbindungen:</text><rect x="12" y="594" width="426" height="70" rx="11" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="26" y="619" font-size="16" fill="#176c63" font-weight="700" text-anchor="start">OR: Sonne +1 · Freund:innen +1</text><text x="26" y="646" font-size="15" fill="#52656a" font-weight="400" text-anchor="start">Bias −0,5  →  1</text><rect x="12" y="675" width="426" height="70" rx="11" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="26" y="700" font-size="16" fill="#be572b" font-weight="700" text-anchor="start">NAND: Sonne −1 · Freund:innen −1</text><text x="26" y="727" font-size="15" fill="#52656a" font-weight="400" text-anchor="start">Bias +1,5  →  1</text><rect x="12" y="756" width="426" height="88" rx="11" fill="#fff" stroke="#cbdbe1" stroke-width="1.5"/><text x="26" y="782" font-size="15" fill="#263b43" font-weight="700" text-anchor="start">Ausgang: OR +1 · NAND +1 · Prüfung −2</text><text x="26" y="806" font-size="15" fill="#be572b" font-weight="700" text-anchor="start">Bias −1,5  →  bei P = 1: Nein</text><text x="26" y="830" font-size="14" fill="#176c63" font-weight="400" text-anchor="start">Bei P = 0 wäre die Antwort Ja.</text><text x="14" y="882" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">1 + 1 − 2·1 − 1,5 = −1,5  →  Nein</text><text x="14" y="910" font-size="16" fill="#263b43" font-weight="700" text-anchor="start">1 + 1 − 2·0 − 1,5 = +0,5  →  Ja</text></svg>