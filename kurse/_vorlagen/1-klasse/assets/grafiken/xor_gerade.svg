<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="740" height="340" fill="#ffffff"/>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Wahrheitstabelle XOR</text>
  <g stroke="#000" stroke-width="1.5">
    <rect x="20" y="45" width="100" height="40" fill="#f2f2f2"/>
    <rect x="120" y="45" width="100" height="40" fill="#f2f2f2"/>
    <rect x="220" y="45" width="120" height="40" fill="#f2f2f2"/>
    <rect x="20" y="85" width="100" height="40" fill="#fff"/><rect x="120" y="85" width="100" height="40" fill="#fff"/><rect x="220" y="85" width="120" height="40" fill="#dae8fc"/>
    <rect x="20" y="125" width="100" height="40" fill="#fff"/><rect x="120" y="125" width="100" height="40" fill="#fff"/><rect x="220" y="125" width="120" height="40" fill="#f8cecc"/>
    <rect x="20" y="165" width="100" height="40" fill="#fff"/><rect x="120" y="165" width="100" height="40" fill="#fff"/><rect x="220" y="165" width="120" height="40" fill="#f8cecc"/>
    <rect x="20" y="205" width="100" height="40" fill="#fff"/><rect x="120" y="205" width="100" height="40" fill="#fff"/><rect x="220" y="205" width="120" height="40" fill="#dae8fc"/>
  </g>
  <g text-anchor="middle" fill="#000">
    <text x="70" y="70" font-weight="bold">Eingabe 1</text><text x="170" y="70" font-weight="bold">Eingabe 2</text><text x="280" y="70" font-weight="bold">Ausgabe</text>
    <text x="70" y="111">0</text><text x="170" y="111">0</text><text x="280" y="111" font-weight="bold">0</text>
    <text x="70" y="151">0</text><text x="170" y="151">1</text><text x="280" y="151" font-weight="bold">1</text>
    <text x="70" y="191">1</text><text x="170" y="191">0</text><text x="280" y="191" font-weight="bold">1</text>
    <text x="70" y="231">1</text><text x="170" y="231">1</text><text x="280" y="231" font-weight="bold">0</text>
  </g>
  <text x="20" y="278" fill="#222">XOR gibt 1, wenn die beiden</text>
  <text x="20" y="298" fill="#222">Eingaben verschieden sind.</text>

  <text x="400" y="28" font-size="16" font-weight="bold" fill="#222">Die vier Fälle als Punkte</text>
  <rect x="400" y="45" width="320" height="240" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <g stroke="#888" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
    <line x1="560" y1="45" x2="560" y2="285"/>
    <line x1="400" y1="165" x2="720" y2="165"/>
    <line x1="400" y1="142" x2="505" y2="285"/>
  </g>
  <g stroke="#000" stroke-width="1.5">
    <circle cx="450" cy="245" r="17" fill="#dae8fc" stroke="#6c8ebf"/>
    <circle cx="670" cy="245" r="17" fill="#f8cecc" stroke="#b85450"/>
    <circle cx="450" cy="85" r="17" fill="#f8cecc" stroke="#b85450"/>
    <circle cx="670" cy="85" r="17" fill="#dae8fc" stroke="#6c8ebf"/>
  </g>
  <g text-anchor="middle" font-weight="bold" fill="#000">
    <text x="450" y="251">0</text><text x="670" y="251">1</text><text x="450" y="91">1</text><text x="670" y="91">0</text>
  </g>
  <g text-anchor="middle" fill="#222" font-size="13">
    <text x="450" y="308">Eingabe 1 = 0</text><text x="670" y="308">Eingabe 1 = 1</text>
    <text x="400" y="326" text-anchor="start">Unten: Eingabe 2 = 0, oben: Eingabe 2 = 1</text>
  </g>

  <circle cx="28" cy="324" r="7" fill="#dae8fc" stroke="#6c8ebf"/><text x="40" y="329" font-size="13" fill="#222">Ausgabe 0</text>
  <circle cx="130" cy="324" r="7" fill="#f8cecc" stroke="#b85450"/><text x="142" y="329" font-size="13" fill="#222">Ausgabe 1</text>
</svg>
