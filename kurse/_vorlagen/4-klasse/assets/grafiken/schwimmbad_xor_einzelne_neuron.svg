<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Helvetica,Arial,sans-serif" font-size="15" role="img" aria-labelledby="titel beschreibung"><title id="titel">XOR-Schwimmbadregel mit einem Neuron</title><desc id="beschreibung">Dieselbe Darstellung wie die Wiederholung: Sonne 1, Freundinnen und Freunde 1, Prüfung morgen 0. Gewichte plus 1, plus 1, minus 4, Bias minus 0 Komma 5. Das Neuron gibt Ja 1 aus, aber die künstliche XOR-Regel verlangt Nein 0. Die Prüfung ist fest 0, ihr Gewicht spielt daher hier keine Rolle.</desc><defs><marker id="pfeil" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="30" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Eingaben</text><text x="215" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Gewichte</text><text x="415" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Neuron</text><text x="615" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Ausgabe</text><circle cx="90" cy="70" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="77" font-size="20" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="90" y="116" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">S: Sonne scheint</text><circle cx="90" cy="165" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="172" font-size="20" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="90" y="211" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">F: Freund:innen gehen mit</text><circle cx="90" cy="260" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="267" font-size="20" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="90" y="306" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">P: Prüfung morgen</text><line x1="125" y1="70" x2="400" y2="138" stroke="#176c63" stroke-width="2.8" marker-end="url(#pfeil)"/><line x1="125" y1="165" x2="396" y2="165" stroke="#176c63" stroke-width="2.8" marker-end="url(#pfeil)"/><line x1="125" y1="260" x2="400" y2="192" stroke="#be572b" stroke-width="5" marker-end="url(#pfeil)"/><rect x="196" y="67" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="85" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="196" y="142" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="160" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="196" y="243" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="261" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−4</text><text x="215" y="307" font-size="13" fill="#52656a" font-weight="400" text-anchor="start">Prüfung = 0: kein Einfluss.</text><circle cx="450" cy="165" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="450" y="162" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="450" y="186" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= +1,5</text><text x="450" y="241" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">Bias b = −0,5</text><line x1="505" y1="165" x2="590" y2="165" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><rect x="600" y="132" width="140" height="66" rx="12" fill="#d7ebe3" stroke="#263b43" stroke-width="2"/><text x="670" y="162" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="670" y="184" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text><text x="670" y="244" font-size="15" fill="#be572b" font-weight="700" text-anchor="middle">XOR-Ziel: Nein (0)</text><text x="670" y="266" font-size="14" fill="#be572b" font-weight="700" text-anchor="middle">→ falscher Fall</text></svg>