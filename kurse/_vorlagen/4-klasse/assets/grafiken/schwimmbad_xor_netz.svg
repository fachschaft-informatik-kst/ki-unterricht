<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="682" viewBox="0 0 1240 682" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title description">
<title id="title">Schwimmbad-Netz mit drei Teilentscheidungen</title>
<desc id="description">Sonne 1, Freundinnen und Freunde 0, Prüfung morgen 1. Die Zwischenschicht berechnet OR 1, NAND 1 und Keine Prüfung 0. Das Ausgabeneuron kombiniert die drei Zahlen mit Gewichten plus 1 und Bias minus 2,5: Ergebnis minus 0,5, also Nein. Bei Prüfung 0 ergibt es Ja. Alle Verbindungsgewichte stehen einheitlich direkt auf den Pfeilen, jeder Bias mittig unter seinem Neuron.</desc>
<defs><marker id="arrPos" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176c63"/></marker><marker id="arrNeg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be572b"/></marker><marker id="arrResult" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263b43"/></marker></defs>
<rect x="0" y="0" width="1240" height="682" rx="14" fill="#f6f9fb" stroke="#e5edf0"/>
<text x="24" y="41" font-size="28" fill="#263b43" font-weight="700" text-anchor="start" >Warum mehrere Neuronen helfen</text>
<text x="24" y="76" font-size="19" fill="#52656a" font-weight="400" text-anchor="start" >OR, NAND und «Keine Prüfung» liefern die drei Werte für den Ausgang.</text>
<text x="126" y="133" font-size="15" fill="#52656a" font-weight="700" text-anchor="middle" >EINGABEN</text>
<text x="513" y="133" font-size="15" fill="#52656a" font-weight="700" text-anchor="middle" >ZWISCHENSCHICHT</text>
<text x="966" y="133" font-size="15" fill="#52656a" font-weight="700" text-anchor="middle" >AUSGABE</text>
<text x="1158" y="133" font-size="15" fill="#52656a" font-weight="700" text-anchor="middle" >ERGEBNIS</text>
<line x1="24" y1="145" x2="1216" y2="145" stroke="#dce7ea" stroke-width="1.5"/>
<line class="network-edge" data-edge="s-or" x1="164" y1="198" x2="460" y2="198" fill="none" stroke="#176c63" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrPos)"/>
<line class="network-edge" data-edge="f-or" x1="164" y1="338" x2="460" y2="221" fill="none" stroke="#176c63" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrPos)"/>
<line class="network-edge" data-edge="s-nand" x1="164" y1="198" x2="460" y2="316" fill="none" stroke="#be572b" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrNeg)"/>
<line class="network-edge" data-edge="f-nand" x1="164" y1="338" x2="460" y2="338" fill="none" stroke="#be572b" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrNeg)"/>
<line class="network-edge" data-edge="p-no_exam" x1="164" y1="494" x2="460" y2="494" fill="none" stroke="#be572b" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrNeg)"/>
<line class="network-edge" data-edge="or-out" x1="567" y1="206" x2="906" y2="315" fill="none" stroke="#176c63" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrPos)"/>
<line class="network-edge" data-edge="nand-out" x1="567" y1="338" x2="906" y2="338" fill="none" stroke="#176c63" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrPos)"/>
<line class="network-edge" data-edge="no_exam-out" x1="567" y1="486" x2="906" y2="361" fill="none" stroke="#176c63" stroke-width="3.4" stroke-linecap="round" marker-end="url(#arrPos)"/>
<line x1="1029" y1="338" x2="1090" y2="338" stroke="#263b43" stroke-width="3" marker-end="url(#arrResult)"/>
<rect x="214.7" y="183" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="258.7" y="204" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle" data-edge="s-or">w = +1</text>
<rect x="214.7" y="285.6" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="258.7" y="306.6" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle" data-edge="f-or">w = +1</text>
<rect x="214.7" y="220.8" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="258.7" y="241.8" font-size="18" fill="#be572b" font-weight="700" text-anchor="middle" data-edge="s-nand">w = −1</text>
<rect x="214.7" y="323" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="258.7" y="344" font-size="18" fill="#be572b" font-weight="700" text-anchor="middle" data-edge="f-nand">w = −1</text>
<rect x="214.7" y="479" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="258.7" y="500" font-size="18" fill="#be572b" font-weight="700" text-anchor="middle" data-edge="p-no_exam">w = −1</text>
<rect x="692.5" y="245.5" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="736.5" y="266.5" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle" data-edge="or-out">w = +1</text>
<rect x="692.5" y="323" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="736.5" y="344" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle" data-edge="nand-out">w = +1</text>
<rect x="692.5" y="408.5" width="88" height="30" rx="8" fill="#ffffff" stroke="#d9e4e8"/>
<text class="line-weight" x="736.5" y="429.5" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle" data-edge="no_exam-out">w = +1</text>
<circle data-node="s" cx="126" cy="198" r="34" fill="#e9f2fb" stroke="#30628c" stroke-width="2.4"/>
<text x="126" y="205" font-size="23" fill="#263b43" font-weight="700" text-anchor="middle" >1</text>
<text x="126" y="255" font-size="16" fill="#263b43" font-weight="400" text-anchor="middle" >Sonne</text>
<circle data-node="f" cx="126" cy="338" r="34" fill="#e9f2fb" stroke="#30628c" stroke-width="2.4"/>
<text x="126" y="345" font-size="23" fill="#263b43" font-weight="700" text-anchor="middle" >0</text>
<text x="126" y="395" font-size="16" fill="#263b43" font-weight="400" text-anchor="middle" >Freund:innen</text>
<circle data-node="p" cx="126" cy="494" r="34" fill="#e9f2fb" stroke="#30628c" stroke-width="2.4"/>
<text x="126" y="501" font-size="23" fill="#263b43" font-weight="700" text-anchor="middle" >1</text>
<text x="126" y="551" font-size="16" fill="#263b43" font-weight="400" text-anchor="middle" >Prüfung morgen</text>
<circle data-node="or" cx="513" cy="198" r="51" fill="#d8f1e6" stroke="#176c63" stroke-width="2.4"/>
<text x="513" y="191" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle" >OR</text>
<text x="513" y="220" font-size="24" fill="#263b43" font-weight="700" text-anchor="middle" >1</text>
<circle data-node="nand" cx="513" cy="338" r="51" fill="#d8f1e6" stroke="#176c63" stroke-width="2.4"/>
<text x="513" y="331" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle" >NAND</text>
<text x="513" y="360" font-size="24" fill="#263b43" font-weight="700" text-anchor="middle" >1</text>
<circle data-node="no_exam" cx="513" cy="494" r="51" fill="#fff0e9" stroke="#be572b" stroke-width="2.4"/>
<text x="513" y="483" font-size="19" fill="#be572b" font-weight="700" text-anchor="middle" >Keine</text>
<text x="513" y="502" font-size="19" fill="#be572b" font-weight="700" text-anchor="middle" >Prüfung</text>
<text x="513" y="523" font-size="23" fill="#263b43" font-weight="700" text-anchor="middle" >0</text>
<circle data-node="out" cx="966" cy="338" r="57" fill="#e0ecf3" stroke="#30628c" stroke-width="2.4"/>
<text x="966" y="330" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle" >Σ + b</text>
<text x="966" y="361" font-size="21" fill="#be572b" font-weight="700" text-anchor="middle" >−0,5</text>
<text class="neuron-bias" x="513" y="277" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle" data-node="or">b = −0,5</text>
<text class="neuron-bias" x="513" y="417" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle" data-node="nand">b = +1,5</text>
<text class="neuron-bias" x="513" y="573" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle" data-node="no_exam">b = +0,5</text>
<text class="neuron-bias" x="966" y="423" font-size="18" fill="#263b43" font-weight="700" text-anchor="middle" data-node="out">b = −2,5</text>
<rect x="1100" y="303" width="117" height="69" rx="11" fill="#e4e9ed" stroke="#c8d1d7"/>
<text x="1158" y="332" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle" >Nein</text>
<text x="1158" y="357" font-size="16" fill="#52656a" font-weight="400" text-anchor="middle" >y = 0</text>
<rect x="21" y="599" width="1198" height="68" rx="10" fill="#eaf2f4" stroke="none"/>
<text x="36" y="625" font-size="18" fill="#263b43" font-weight="700" text-anchor="start" >Ja nur, wenn OR, NAND und «Keine Prüfung» jeweils 1 ausgeben.</text>
<text x="36" y="652" font-size="17" fill="#263b43" font-weight="400" text-anchor="start" >P = 1: 1 + 1 + 0 − 2,5 = −0,5 → Nein      |      P = 0: 1 + 1 + 1 − 2,5 = +0,5 → Ja</text>
</svg>
