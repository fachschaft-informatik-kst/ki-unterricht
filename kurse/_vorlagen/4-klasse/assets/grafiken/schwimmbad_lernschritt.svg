<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="660" viewBox="0 0 1550 660" font-family="Helvetica,Arial,sans-serif" font-size="15" role="img" aria-labelledby="titel beschreibung"><title id="titel">Schwimmbad-Neuron vor und nach dem Lernen</title><desc id="beschreibung">Zwei vollständige gleich grosse Neuronen nebeneinander: Sonne 1, Freundinnen und Freunde 0, Prüfung morgen 0. Links Sonnengewicht 0 und Bias minus 1 Komma 5, Vorhersage Nein. Rechts Sonnengewicht plus 1 und Bias minus 0 Komma 5, Vorhersage Ja. Andere Gewichte und Eingaben unverändert.</desc><defs><marker id="pfeil" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#263b43"/></marker></defs><rect x="0" y="0" width="1550" height="660" rx="18" fill="#f4f8fa" stroke="#f4f8fa" stroke-width="0"/><text x="25" y="45" font-size="28" fill="#173e50" font-weight="700" text-anchor="start">Was lernt ein Schwimmbad-Neuron?</text><text x="25" y="78" font-size="19" fill="#28495a" font-weight="700" text-anchor="start">Gleiche Eingaben: Sonne 1 · Freund:innen 0 · Prüfung morgen 0   |   Ziel: Ja (1)</text><g transform="translate(18 102)"><rect x="0" y="0" width="748" height="409" rx="15" fill="#ffffff" stroke="#cad9e1" stroke-width="1.5"/><text x="18" y="33" font-size="22" fill="#9d4239" font-weight="700" text-anchor="start">1  VORHER: falsche Vorhersage</text><g transform="translate(8 57) scale(0.956)"><rect x="0" y="0" width="760" height="330" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="30" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Eingaben</text><text x="215" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Gewichte</text><text x="415" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Neuron</text><text x="615" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Ausgabe</text><circle cx="90" cy="70" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="77" font-size="20" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="90" y="116" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">S: Sonne scheint</text><circle cx="90" cy="165" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="172" font-size="20" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="90" y="211" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">F: Freund:innen gehen mit</text><circle cx="90" cy="260" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="267" font-size="20" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="90" y="306" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">P: Prüfung morgen</text><line x1="125" y1="70" x2="400" y2="138" stroke="#8d9aa0" stroke-width="2" marker-end="url(#pfeil)"/><line x1="125" y1="165" x2="396" y2="165" stroke="#176c63" stroke-width="3.5" marker-end="url(#pfeil)"/><line x1="125" y1="260" x2="400" y2="192" stroke="#be572b" stroke-width="5" marker-end="url(#pfeil)"/><rect x="196" y="69" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="87" font-size="17" fill="#8d9aa0" font-weight="700" text-anchor="middle">0</text><rect x="196" y="142" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="160" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+2</text><rect x="196" y="242" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="260" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−4</text><text x="215" y="307" font-size="13" fill="#52656a" font-weight="400" text-anchor="start">Negatives Gewicht: spricht dagegen.</text><circle cx="450" cy="165" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="450" y="162" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="450" y="186" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= −1,5</text><text x="450" y="242" font-size="14" fill="#52656a" font-weight="400" text-anchor="middle">Bias b = −1,5</text><text x="450" y="260" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">(Grundhaltung)</text><line x1="505" y1="165" x2="590" y2="165" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><rect x="600" y="132" width="140" height="66" rx="12" fill="#e3e6e8" stroke="#263b43" stroke-width="2"/><text x="670" y="163" font-size="22" fill="#52656a" font-weight="700" text-anchor="middle">Nein</text><text x="670" y="184" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">y = 0</text></g></g><g transform="translate(784 102)"><rect x="0" y="0" width="748" height="409" rx="15" fill="#ffffff" stroke="#cad9e1" stroke-width="1.5"/><text x="18" y="33" font-size="22" fill="#176c63" font-weight="700" text-anchor="start">2  NACHHER: richtige Vorhersage</text><g transform="translate(8 57) scale(0.956)"><rect x="0" y="0" width="760" height="330" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="30" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Eingaben</text><text x="215" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Gewichte</text><text x="415" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Neuron</text><text x="615" y="26" font-size="16" fill="#222" font-weight="700" text-anchor="start">Ausgabe</text><circle cx="90" cy="70" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="77" font-size="20" fill="#111" font-weight="700" text-anchor="middle">1</text><text x="90" y="116" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">S: Sonne scheint</text><circle cx="90" cy="165" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="172" font-size="20" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="90" y="211" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">F: Freund:innen gehen mit</text><circle cx="90" cy="260" r="30" fill="#eaf1f8" stroke="#30628c" stroke-width="1.7"/><text x="90" y="267" font-size="20" fill="#111" font-weight="700" text-anchor="middle">0</text><text x="90" y="306" font-size="13" fill="#263b43" font-weight="400" text-anchor="middle">P: Prüfung morgen</text><line x1="125" y1="70" x2="400" y2="138" stroke="#176c63" stroke-width="2.8" marker-end="url(#pfeil)"/><line x1="125" y1="165" x2="396" y2="165" stroke="#176c63" stroke-width="3.5" marker-end="url(#pfeil)"/><line x1="125" y1="260" x2="400" y2="192" stroke="#be572b" stroke-width="5" marker-end="url(#pfeil)"/><rect x="196" y="69" width="48" height="25" rx="6" fill="#e5f5ed" stroke="#84bca1" stroke-width="1"/><text x="220" y="87" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+1</text><rect x="196" y="142" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="160" font-size="17" fill="#176c63" font-weight="700" text-anchor="middle">+2</text><rect x="196" y="242" width="48" height="25" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="220" y="260" font-size="17" fill="#be572b" font-weight="700" text-anchor="middle">−4</text><text x="215" y="307" font-size="13" fill="#52656a" font-weight="400" text-anchor="start">Negatives Gewicht: spricht dagegen.</text><circle cx="450" cy="165" r="52" fill="#cfe8dc" stroke="#263b43" stroke-width="2.5"/><text x="450" y="162" font-size="22" fill="#263b43" font-weight="700" text-anchor="middle">Σ + b</text><text x="450" y="186" font-size="15" fill="#263b43" font-weight="400" text-anchor="middle">= +0,5</text><rect x="380" y="224" width="140" height="27" rx="7" fill="#e5f5ed" stroke="#84bca1" stroke-width="1"/><text x="450" y="242" font-size="14" fill="#52656a" font-weight="700" text-anchor="middle">Bias b = −0,5</text><text x="450" y="260" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">(Grundhaltung)</text><line x1="505" y1="165" x2="590" y2="165" stroke="#263b43" stroke-width="2.5" marker-end="url(#pfeil)"/><rect x="600" y="132" width="140" height="66" rx="12" fill="#d7ebe3" stroke="#263b43" stroke-width="2"/><text x="670" y="163" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">Ja</text><text x="670" y="184" font-size="13" fill="#52656a" font-weight="400" text-anchor="middle">y = 1</text></g></g><rect x="18" y="535" width="1514" height="67" rx="11" fill="#e8f4ed" stroke="#a1cbb5" stroke-width="1.2"/><text x="38" y="564" font-size="18" fill="#176c63" font-weight="700" text-anchor="start">Lernrate 1 · Fehler = Ziel 1 − Ausgabe 0 = +1</text><text x="38" y="591" font-size="18" fill="#176c63" font-weight="700" text-anchor="start">Geändert: Sonnengewicht 0 → +1 · Bias −1,5 → −0,5</text><text x="25" y="634" font-size="17" fill="#52656a" font-weight="400" text-anchor="start">Unverändert: alle Eingaben, Gewichte von Freund:innen und Prüfung, Rechenregel (ab 0 = Ja).</text></svg>