<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" fill="none" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="120" y1="420" x2="660" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="120" y1="420" x2="120" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Fine grid (0..1) -->
  <!-- Coordinate mapping: x in [0,1] -> [120,620] (step 0.1 = 50px), y in [0,1] -> [420,120] (step 0.1 = 30px) -->
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="170" y1="420" x2="170" y2="120" />
    <line x1="220" y1="420" x2="220" y2="120" />
    <line x1="270" y1="420" x2="270" y2="120" />
    <line x1="320" y1="420" x2="320" y2="120" />
    <line x1="370" y1="420" x2="370" y2="120" />
    <line x1="420" y1="420" x2="420" y2="120" />
    <line x1="470" y1="420" x2="470" y2="120" />
    <line x1="520" y1="420" x2="520" y2="120" />
    <line x1="570" y1="420" x2="570" y2="120" />

    <line x1="120" y1="390" x2="620" y2="390" />
    <line x1="120" y1="360" x2="620" y2="360" />
    <line x1="120" y1="330" x2="620" y2="330" />
    <line x1="120" y1="300" x2="620" y2="300" />
    <line x1="120" y1="270" x2="620" y2="270" />
    <line x1="120" y1="240" x2="620" y2="240" />
    <line x1="120" y1="210" x2="620" y2="210" />
    <line x1="120" y1="180" x2="620" y2="180" />
    <line x1="120" y1="150" x2="620" y2="150" />
  </g>

  <!-- Major grid at 0.5 -->
  <g stroke="#bdbdbd" stroke-width="1.5">
    <line x1="370" y1="420" x2="370" y2="120" />
    <line x1="120" y1="270" x2="620" y2="270" />
  </g>

  <!-- Border (0 and 1) -->
  <g stroke="#bbb" stroke-width="1.5">
    <line x1="120" y1="420" x2="620" y2="420" />
    <line x1="120" y1="120" x2="620" y2="120" />
    <line x1="120" y1="420" x2="120" y2="120" />
    <line x1="620" y1="420" x2="620" y2="120" />
  </g>

  <!-- Axis ticks -->
  <g fill="#333" stroke="#333" stroke-width="2" font-size="16">
    <line x1="120" y1="420" x2="120" y2="430" />
    <line x1="370" y1="420" x2="370" y2="430" />
    <line x1="620" y1="420" x2="620" y2="430" />
    <line x1="110" y1="420" x2="120" y2="420" />
    <line x1="110" y1="270" x2="120" y2="270" />
    <line x1="110" y1="120" x2="120" y2="120" />
  </g>

  <!-- Axis tick labels -->
  <g fill="#333" font-size="14">
    <text x="116" y="452" text-anchor="end">0</text>
    <text x="370" y="452" text-anchor="middle">0.5</text>
    <text x="620" y="452" text-anchor="middle">1</text>

    <text x="98" y="424" text-anchor="end">0</text>
    <text x="98" y="274" text-anchor="end">0.5</text>
    <text x="98" y="124" text-anchor="end">1</text>
  </g>

  <!-- Decision boundary (slice x3=x4=0.5, threshold z=0.28): x2 = 1.8 - 2 x1 (only segment within [0,1]x[0,1]) -->
  <!-- Intersections: (x1=0.4, x2=1) and (x1=0.9, x2=0) -->
  <line x1="320" y1="120" x2="570" y2="420" stroke="#c0392b" stroke-width="3" />
  <text x="395" y="145" font-size="14" fill="#c0392b">z = 0.28</text>

  <!-- Helper points to draw the line: A=(0.4,1), B=(0.9,0) -->
  <g stroke="#c0392b" stroke-width="2" fill="#fff">
    <circle cx="320" cy="120" r="6" />
    <circle cx="570" cy="420" r="6" />
  </g>
  <g fill="#c0392b" font-size="13">
    <text x="328" y="112">A (0.4, 1)</text>
    <text x="578" y="442">B (0.9, 0)</text>
  </g>

  <!-- Sample points (class 0 = blue, class 1 = orange) -->
  <g stroke="#2c3e50" stroke-width="2">
    <!-- (0.2, 0.1) -> (220, 390) -->
    <circle cx="220" cy="390" r="9" fill="#3498db" />
    <!-- (0.8, 0.9) -> (520, 150) -->
    <circle cx="520" cy="150" r="9" fill="#f39c12" />
  </g>

  <!-- Labels -->
  <g fill="#2c3e50" font-size="14">
    <text x="228" y="410">(0.2, 0.1)</text>
    <text x="528" y="170">(0.8, 0.9)</text>
  </g>

  <!-- Legend (blue/yellow points) -->
  <!-- NOTE: SVG text does not render LaTeX; use plain Unicode for ŷ. -->
  <g>
    <rect x="430" y="18" width="230" height="60" rx="8" ry="8" fill="#ffffff" stroke="#d0d0d0" />
    <circle cx="450" cy="40" r="7" fill="#3498db" stroke="#2c3e50" stroke-width="1" />
    <text x="465" y="44" font-size="13" fill="#2c3e50">Punkt mit ŷ = 0</text>

    <circle cx="450" cy="62" r="7" fill="#f39c12" stroke="#2c3e50" stroke-width="1" />
    <text x="465" y="66" font-size="13" fill="#2c3e50">Punkt mit ŷ = 1</text>
  </g>

  <!-- Axis titles -->
  <text x="655" y="470" font-size="16" fill="#333">x<tspan dy="5" font-size="12">1</tspan></text>
  <text x="74" y="96" font-size="16" fill="#333" transform="rotate(-90 74 96)">x<tspan dy="5" font-size="12">2</tspan></text>
</svg>
